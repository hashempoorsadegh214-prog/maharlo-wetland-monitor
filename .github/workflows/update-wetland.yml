name: Update Maharloo Wetland Archive

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  update-wetland:
    runs-on: ubuntu-latest

    steps:

      - name: Get repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          pip install requests pillow shapely rasterio numpy pyproj

      - name: Build 30 day archive
        env:
          CDSE_CLIENT_ID: ${{ secrets.CDSE_CLIENT_ID }}
          CDSE_CLIENT_SECRET: ${{ secrets.CDSE_CLIENT_SECRET }}

        run: |

          python - <<'PY'

          import json
          import os
          import shutil
          import requests

          from datetime import datetime, timedelta, timezone

          import numpy as np

          from PIL import Image

          from shapely.geometry import shape, mapping
          from shapely.ops import transform as shp_transform

          from pyproj import Transformer

          import rasterio
          from rasterio.transform import from_bounds
          from rasterio.features import geometry_mask


          # =====================================================
          # تنظیمات
          # =====================================================

          GEOJSON_FILE = "bestar_talab_maharlo.geojson"

          ARCHIVE_DIR = "data/archive"

          ARCHIVE_JSON = "data/archive.json"

          MAX_CLOUD = 20

          DAYS_BACK = 30

          WATER_PIXEL_SIZE = 20


          # =====================================================
          # پاک کردن آرشیو قدیمی
          # =====================================================

          os.makedirs(
              ARCHIVE_DIR,
              exist_ok=True
          )


          # فایل‌های قبلی آرشیو را پاک می‌کنیم
          for name in os.listdir(ARCHIVE_DIR):

              path = os.path.join(
                  ARCHIVE_DIR,
                  name
              )

              if os.path.isfile(path):

                  os.remove(path)


          # =====================================================
          # خواندن مرز تالاب
          # =====================================================

          with open(
              GEOJSON_FILE,
              "r",
              encoding="utf-8"
          ) as f:

              geojson = json.load(f)


          if not geojson.get("features"):

              raise Exception(
                  "فایل GeoJSON فاقد Feature است."
              )


          geometry = geojson["features"][0]["geometry"]


          wetland = shape(
              geometry
          ).buffer(0)


          if wetland.is_empty:

              raise Exception(
                  "مرز تالاب معتبر نیست."
              )


          # =====================================================
          # BBOX تالاب
          # =====================================================

          min_lon, min_lat, max_lon, max_lat = (
              wetland.bounds
          )


          bbox = [
              min_lon,
              min_lat,
              max_lon,
              max_lat
          ]


          print(
              "Wetland BBOX:",
              bbox
          )


          # =====================================================
          # ورود به Copernicus
          # =====================================================

          token_url = (
              "https://identity.dataspace.copernicus.eu/"
              "auth/realms/CDSE/protocol/openid-connect/token"
          )


          token_response = requests.post(

              token_url,

              data={

                  "grant_type":
                      "client_credentials",

                  "client_id":
                      os.environ[
                          "CDSE_CLIENT_ID"
                      ],

                  "client_secret":
                      os.environ[
                          "CDSE_CLIENT_SECRET"
                      ]

              },

              timeout=60

          )


          if token_response.status_code != 200:

              print(
                  token_response.text
              )

              raise Exception(
                  "Copernicus authentication failed."
              )


          access_token = (
              token_response
              .json()
              ["access_token"]
          )


          headers = {

              "Authorization":
                  "Bearer " +
                  access_token,

              "Content-Type":
                  "application/json"

          }


          print(
              "Copernicus authentication OK"
          )


          # =====================================================
          # پیدا کردن تصاویر ۳۰ روز گذشته
          # =====================================================

          now = datetime.now(
              timezone.utc
          )


          start = (
              now -
              timedelta(
                  days=DAYS_BACK
              )
          )


          stac_url = (
              "https://stac.dataspace.copernicus.eu/"
              "v1/search"
          )


          stac_request = {

              "collections": [

                  "sentinel-2-l2a"

              ],

              "datetime":

                  start.isoformat()
                  + "/"
                  + now.isoformat(),

              "intersects":

                  mapping(
                      wetland
                  ),

              "query": {

                  "eo:cloud_cover": {

                      "lte":
                          MAX_CLOUD

                  }

              },

              "sortby": [

                  {

                      "field":
                          "properties.datetime",

                      "direction":
                          "desc"

                  }

              ],

              "limit":
                  100

          }


          print(
              "Searching 30 days..."
          )


          stac_response = requests.post(

              stac_url,

              json=stac_request,

              timeout=120

          )


          if stac_response.status_code != 200:

              print(
                  stac_response.text[:3000]
              )

              raise Exception(
                  "STAC search failed."
              )


          features = (
              stac_response
              .json()
              .get(
                  "features",
                  []
              )
          )


          print(
              "STAC results:",
              len(features)
          )


          if not features:

              raise Exception(
                  "در ۳۰ روز گذشته تصویر مناسب پیدا نشد."
              )


          # =====================================================
          # فقط یک تصویر برای هر روز
          # اگر یک روز چند تصویر بود،
          # کم‌ابرترین انتخاب می‌شود.
          # =====================================================

          by_day = {}


          for feature in features:

              props = feature.get(
                  "properties",
                  {}
              )


              dt = props.get(
                  "datetime"
              )


              if not dt:

                  continue


              day = dt[:10]


              cloud = props.get(
                  "eo:cloud_cover"
              )


              try:

                  cloud_value = float(
                      cloud
                  )

              except:

                  cloud_value = 999


              item = {

                  "id":
                      feature.get(
                          "id"
                      ),

                  "datetime":
                      dt,

                  "date":
                      day,

                  "cloud_cover":
                      cloud_value

              }


              if (
                  day not in by_day
                  or
                  cloud_value <
                  by_day[day]["cloud_cover"]
              ):

                  by_day[day] = item


          selected_days = sorted(

              by_day.values(),

              key=lambda x:
                  x["date"],

              reverse=True

          )


          print(
              "Available image days:",
              len(selected_days)
          )


          # =====================================================
          # UTM منطقه مهارلو
          # =====================================================

          to_utm = Transformer.from_crs(

              "EPSG:4326",

              "EPSG:32639",

              always_xy=True

          ).transform


          from_utm = Transformer.from_crs(

              "EPSG:32639",

              "EPSG:4326",

              always_xy=True

          ).transform


          wetland_utm = shp_transform(

              to_utm,

              wetland

          )


          utm_min_x, utm_min_y, utm_max_x, utm_max_y = (
              wetland_utm.bounds
          )


          # =====================================================
          # Evalscript تصویر RGB
          # =====================================================

          rgb_evalscript = """

          //VERSION=3

          function setup() {

              return {

                  input: [
                      "B02",
                      "B03",
                      "B04"
                  ],

                  output: {

                      bands: 3,

                      sampleType:
                          "AUTO"

                  }

              };

          }

          function evaluatePixel(sample) {

              return [

                  2.5 * sample.B04,

                  2.5 * sample.B03,

                  2.5 * sample.B02

              ];

          }

          """


          # =====================================================
          # Evalscript آب
          # فرمول کاربر:
          # MNDWI + AWEI
          # =====================================================

          water_evalscript = """

          //VERSION=3

          function setup() {

              return {

                  input: [

                      "B03",
                      "B08",
                      "B11",
                      "B12"

                  ],

                  output: {

                      bands: 1,

                      sampleType:
                          "UINT8"

                  }

              };

          }


          function evaluatePixel(sample) {

              let mndwi =

                  (
                      sample.B03 -
                      sample.B11
                  )

                  /

                  (
                      sample.B03 +
                      sample.B11
                  );


              let awei =

                  4 *

                  (
                      sample.B03 -
                      sample.B11
                  )

                  -

                  (
                      0.25 *
                      sample.B08

                      +

                      2.75 *
                      sample.B12
                  );


              if (

                  awei > -0.1

                  &&

                  mndwi > 0

              ) {

                  return [1];

              }


              return [0];

          }

          """


          # =====================================================
          # پردازش هر روز
          # =====================================================

          archive_items = []


          for index, item in enumerate(
              selected_days,
              start=1
          ):

              day = item["date"]

              cloud = item["cloud_cover"]

              day_start = (
                  day +
                  "T00:00:00Z"
              )

              day_end = (
                  day +
                  "T23:59:59Z"
              )


              print("")
              print(
                  "====================================="
              )

              print(
                  f"{index}/{len(selected_days)}"
              )

              print(
                  "Date:",
                  day
              )

              print(
                  "Cloud:",
                  cloud
              )

              print(
                  "====================================="
              )


              # =================================================
              # نام فایل‌ها
              # =================================================

              rgb_file = os.path.join(

                  ARCHIVE_DIR,

                  f"rgb_{day}.png"

              )


              water_file = os.path.join(

                  ARCHIVE_DIR,

                  f"water_{day}.png"

              )


              tiff_file = os.path.join(

                  ARCHIVE_DIR,

                  f"water_{day}.tif"

              )


              # =================================================
              # RGB
              # =================================================

              rgb_request = {

                  "input": {

                      "bounds": {

                          "properties": {

                              "crs":
                              "http://www.opengis.net/def/crs/OGC/1.3/CRS84"

                          },

                          "bbox":
                              bbox

                      },

                      "data": [

                          {

                              "type":
                                  "sentinel-2-l2a",

                              "dataFilter": {

                                  "timeRange": {

                                      "from":
                                          day_start,

                                      "to":
                                          day_end

                                  },

                                  "mosaickingOrder":
                                      "leastCC"

                              }

                          }

                      ]

                  },

                  "output": {

                      "width":
                          1200,

                      "height":
                          1200,

                      "responses": [

                          {

                              "identifier":
                                  "default",

                              "format": {

                                  "type":
                                      "image/png"

                              }

                          }

                      ]

                  },

                  "evalscript":
                      rgb_evalscript

              }


              rgb_response = requests.post(

                  "https://sh.dataspace.copernicus.eu/process/v1",

                  headers=headers,

                  json=rgb_request,

                  timeout=300

              )


              if rgb_response.status_code != 200:

                  print(
                      rgb_response.text[:2000]
                  )

                  print(
                      "RGB skipped for",
                      day
                  )

                  continue


              with open(
                  rgb_file,
                  "wb"
              ) as f:

                  f.write(
                      rgb_response.content
                  )


              # =================================================
              # آب - GeoTIFF واقعی 20 متر
              # =================================================

              water_request = {

                  "input": {

                      "bounds": {

                          "properties": {

                              "crs":
                              "http://www.opengis.net/def/crs/EPSG/0/32639"

                          },

                          "bbox": [

                              utm_min_x,
                              utm_min_y,
                              utm_max_x,
                              utm_max_y

                          ]

                      },

                      "data": [

                          {

                              "type":
                                  "sentinel-2-l2a",

                              "dataFilter": {

                                  "timeRange": {

                                      "from":
                                          day_start,

                                      "to":
                                          day_end

                                  },

                                  "mosaickingOrder":
                                      "leastCC"

                              }

                          }

                      ]

                  },

                  "output": {

                      "resx":
                          WATER_PIXEL_SIZE,

                      "resy":
                          WATER_PIXEL_SIZE,

                      "responses": [

                          {

                              "identifier":
                                  "default",

                              "format": {

                                  "type":
                                      "image/tiff"

                              }

                          }

                      ]

                  },

                  "evalscript":
                      water_evalscript

              }


              water_response = requests.post(

                  "https://sh.dataspace.copernicus.eu/process/v1",

                  headers=headers,

                  json=water_request,

                  timeout=300

              )


              if water_response.status_code != 200:

                  print(
                      water_response.text[:2000]
                  )

                  print(
                      "Water skipped for",
                      day
                  )

                  continue


              with open(
                  tiff_file,
                  "wb"
              ) as f:

                  f.write(
                      water_response.content
                  )


              # =================================================
              # شمارش دقیق پیکسل‌های آب داخل تالاب
              # =================================================

              with rasterio.open(
                  tiff_file
              ) as src:

                  water_array = src.read(1)

                  transform = src.transform

                  raster_crs = src.crs


              # تبدیل Polygon به CRS تصویر
              if raster_crs:

                  to_raster = Transformer.from_crs(

                      "EPSG:4326",

                      raster_crs,

                      always_xy=True

                  ).transform

                  wetland_raster = shp_transform(

                      to_raster,

                      wetland

                  )

              else:

                  wetland_raster = wetland


              inside_mask = geometry_mask(

                  [wetland_raster],

                  out_shape=water_array.shape,

                  transform=transform,

                  invert=True

              )


              water_mask = (
                  (water_array > 0)
                  &
                  inside_mask
              )


              water_pixels = int(
                  np.count_nonzero(
                      water_mask
                  )
              )


              water_area_m2 = (
                  water_pixels *
                  WATER_PIXEL_SIZE *
                  WATER_PIXEL_SIZE
              )


              water_area_ha = (
                  water_area_m2 /
                  10000.0
              )


              # =================================================
              # ساخت PNG آب برای نمایش سایت
              # =================================================

              water_display = np.zeros(

                  (
                      water_array.shape[0],
                      water_array.shape[1],
                      4
                  ),

                  dtype=np.uint8

              )


              water_display[
                  water_mask,
                  0
              ] = 0

              water_display[
                  water_mask,
                  1
              ] = 120

              water_display[
                  water_mask,
                  2
              ] = 255

              water_display[
                  water_mask,
                  3
              ] = 220


              Image.fromarray(
                  water_display
              ).save(
                  water_file
              )


              # =================================================
              # حذف TIFF
              # =================================================

              if os.path.exists(
                  tiff_file
              ):

                  os.remove(
                      tiff_file
                  )


              # =================================================
              # ذخیره اطلاعات روز
              # =================================================

              archive_items.append({

                  "date":
                      day,

                  "datetime":
                      item["datetime"],

                  "cloud_cover":
                      cloud,

                  "image":
                      f"archive/rgb_{day}.png",

                  "water_image":
                      f"archive/water_{day}.png",

                  "water_pixels":
                      water_pixels,

                  "water_area_ha":
                      round(
                          water_area_ha,
                          2
                      )

              })


              print(
                  "Water:",
                  round(
                      water_area_ha,
                      2
                  ),
                  "ha"
              )


          # =====================================================
          # مرتب‌سازی
          # =====================================================

          archive_items.sort(

              key=lambda x:
                  x["date"],

              reverse=True

          )


          # =====================================================
          # ذخیره آرشیو
          # =====================================================

          archive = {

              "updated_at":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "period_days":
                  DAYS_BACK,

              "max_cloud":
                  MAX_CLOUD,

              "available_days":
                  len(
                      archive_items
                  ),

              "items":
                  archive_items

          }


          os.makedirs(
              "data",
              exist_ok=True
          )


          with open(
              ARCHIVE_JSON,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(

                  archive,

                  f,

                  ensure_ascii=False,

                  indent=2

              )


          # =====================================================
          # آخرین تصویر را در فایل‌های اصلی هم کپی کن
          # =====================================================

          if archive_items:

              latest = archive_items[0]


              source_rgb = latest["image"]


              source_water = latest["water_image"]


              shutil.copyfile(

                  os.path.join(
                      "data",
                      source_rgb
                  ),

                  "data/maharlo_sentinel2.png"

              )


              shutil.copyfile(

                  os.path.join(
                      "data",
                      source_water
                  ),

                  "data/maharlo_water.png"

              )


          print("")
          print(
              "====================================="
          )

          print(
              "ARCHIVE COMPLETE"
          )

          print(
              "Available days:",
              len(archive_items)
          )

          print(
              "=====================================")

          PY


      - name: Save archive
        run: |

          git config user.name "github-actions"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/archive.json \
            data/archive \
            data/maharlo_sentinel2.png \
            data/maharlo_water.png

          git diff --cached --quiet || \
            git commit \
            -m "Update 30 day wetland archive"

          git push
