name: Update Maharloo Wetland

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  update-wetland:
    runs-on: ubuntu-latest

    steps:

      - name: Get repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          pip install requests

      - name: Download RGB and Water
        env:
          CDSE_CLIENT_ID: ${{ secrets.CDSE_CLIENT_ID }}
          CDSE_CLIENT_SECRET: ${{ secrets.CDSE_CLIENT_SECRET }}

        run: |

          python - <<'PY'

          import json
          import os
          import requests

          from datetime import datetime, timedelta, timezone


          GEOJSON_FILE = "bestar_talab_maharlo.geojson"

          RGB_FILE = "data/maharlo_sentinel2.png"

          WATER_FILE = "data/maharlo_water.png"

          INFO_FILE = "data/wetland-data.json"


          # =====================================================
          # خواندن مرز
          # =====================================================

          with open(
              GEOJSON_FILE,
              "r",
              encoding="utf-8"
          ) as f:

              geojson = json.load(f)


          geometry = geojson["features"][0]["geometry"]

          points = []


          def collect_points(obj):

              if (
                  isinstance(obj, list)
                  and len(obj) >= 2
                  and isinstance(obj[0], (int, float))
                  and isinstance(obj[1], (int, float))
              ):

                  points.append(
                      (obj[0], obj[1])
                  )

              elif isinstance(obj, list):

                  for item in obj:
                      collect_points(item)


          collect_points(
              geometry["coordinates"]
          )


          min_lon = min(
              p[0] for p in points
          )

          max_lon = max(
              p[0] for p in points
          )

          min_lat = min(
              p[1] for p in points
          )

          max_lat = max(
              p[1] for p in points
          )


          bbox = [
              min_lon,
              min_lat,
              max_lon,
              max_lat
          ]


          print("BBOX:", bbox)


          # =====================================================
          # Token
          # =====================================================

          token_url = (
              "https://identity.dataspace.copernicus.eu/"
              "auth/realms/CDSE/protocol/openid-connect/token"
          )


          token_response = requests.post(

              token_url,

              data={
                  "grant_type":
                      "client_credentials",

                  "client_id":
                      os.environ["CDSE_CLIENT_ID"],

                  "client_secret":
                      os.environ["CDSE_CLIENT_SECRET"]
              },

              timeout=60
          )


          if token_response.status_code != 200:

              print(
                  token_response.text
              )

              raise Exception(
                  "Authentication failed"
              )


          token = (
              token_response
              .json()
              ["access_token"]
          )


          # =====================================================
          # زمان
          # =====================================================

          now = datetime.now(
              timezone.utc
          )

          start = (
              now -
              timedelta(days=30)
          )


          process_url = (
              "https://sh.dataspace.copernicus.eu/"
              "process/v1"
          )


          headers = {

              "Authorization":
                  "Bearer " + token,

              "Content-Type":
                  "application/json"

          }


          # =====================================================
          # RGB
          # =====================================================

          rgb_evalscript = """

          //VERSION=3

          function setup() {

              return {

                  input: [
                      "B02",
                      "B03",
                      "B04"
                  ],

                  output: {

                      bands: 3,

                      sampleType: "AUTO"

                  }

              };

          }


          function evaluatePixel(sample) {

              return [

                  2.5 * sample.B04,

                  2.5 * sample.B03,

                  2.5 * sample.B02

              ];

          }

          """


          rgb_request = {

              "input": {

                  "bounds": {

                      "properties": {

                          "crs":
                          "http://www.opengis.net/def/crs/OGC/1.3/CRS84"

                      },

                      "bbox": bbox

                  },

                  "data": [

                      {

                          "type":
                              "sentinel-2-l2a",

                          "dataFilter": {

                              "timeRange": {

                                  "from":
                                      start.isoformat(),

                                  "to":
                                      now.isoformat()

                              },

                              "maxCloudCoverage":
                                  20,

                              "mosaickingOrder":
                                  "leastCC"

                          }

                      }

                  ]

              },

              "output": {

                  "width": 1200,
                  "height": 1200,

                  "responses": [

                      {

                          "identifier":
                              "default",

                          "format": {

                              "type":
                                  "image/png"

                          }

                      }

                  ]

              },

              "evalscript":
                  rgb_evalscript

          }


          rgb_response = requests.post(

              process_url,

              headers=headers,

              json=rgb_request,

              timeout=300
          )


          if rgb_response.status_code != 200:

              print(
                  rgb_response.text[:2000]
              )

              raise Exception(
                  "RGB request failed"
              )


          os.makedirs(
              "data",
              exist_ok=True
          )


          with open(
              RGB_FILE,
              "wb"
          ) as f:

              f.write(
                  rgb_response.content
              )


          print(
              "RGB saved"
          )


          # =====================================================
          # MNDWI + AWEI
          # =====================================================

          water_evalscript = """

          //VERSION=3

          function setup() {

              return {

                  input: [
                      "B03",
                      "B08",
                      "B11",
                      "B12"
                  ],

                  output: {

                      bands: 4,

                      sampleType: "AUTO"

                  }

              };

          }


          function evaluatePixel(sample) {

              let mndwi =
                  (sample.B03 - sample.B11) /
                  (sample.B03 + sample.B11);


              let awei =
                  4 * (sample.B03 - sample.B11) -
                  (
                      0.25 * sample.B08 +
                      2.75 * sample.B12
                  );


              /*
                 فرمول شما
              */

              let isWater =
                  (
                      awei > -0.1 &&
                      mndwi > 0
                  );


              if (isWater) {

                  /*
                     آب = آبی پررنگ
                  */

                  return [
                      0.0,
                      0.25,
                      1.0,
                      1.0
                  ];

              }


              /*
                 غیرآب = شفاف
              */

              return [
                  0.0,
                  0.0,
                  0.0,
                  0.0
              ];

          }

          """


          water_request = {

              "input": {

                  "bounds": {

                      "properties": {

                          "crs":
                          "http://www.opengis.net/def/crs/OGC/1.3/CRS84"

                      },

                      "bbox": bbox

                  },

                  "data": [

                      {

                          "type":
                              "sentinel-2-l2a",

                          "dataFilter": {

                              "timeRange": {

                                  "from":
                                      start.isoformat(),

                                  "to":
                                      now.isoformat()

                              },

                              "maxCloudCoverage":
                                  20,

                              "mosaickingOrder":
                                  "leastCC"

                          }

                      }

                  ]

              },

              "output": {

                  "width": 1200,
                  "height": 1200,

                  "responses": [

                      {

                          "identifier":
                              "default",

                          "format": {

                              "type":
                                  "image/png"

                          }

                      }

                  ]

              },

              "evalscript":
                  water_evalscript

          }


          water_response = requests.post(

              process_url,

              headers=headers,

              json=water_request,

              timeout=300
          )


          print(
              "WATER HTTP:",
              water_response.status_code
          )


          if water_response.status_code != 200:

              print(
                  water_response.text[:3000]
              )

              raise Exception(
                  "Water request failed"
              )


          with open(
              WATER_FILE,
              "wb"
          ) as f:

              f.write(
                  water_response.content
              )


          print(
              "Water layer saved"
          )


          # =====================================================
          # JSON
          # =====================================================

          info = {

              "updated_at":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "image": {

                  "file":
                      "data/maharlo_sentinel2.png",

                  "bbox":
                      bbox,

                  "type":
                      "Sentinel-2 L2A",

                  "max_cloud":
                      20

              },

              "water": {

                  "file":
                      "data/maharlo_water.png",

                  "method":
                      "MNDWI + AWEI",

                  "mndwi":
                      "(B03 - B11) / (B03 + B11)",

                  "awei":
                      "4*(B03-B11) - (0.25*B08 + 2.75*B12)",

                  "condition":
                      "AWEI > -0.1 AND MNDWI > 0"

              }

          }


          with open(
              INFO_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  info,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          print(
              "DONE"
          )

          PY


      - name: Save files
        run: |

          git config user.name "github-actions"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/maharlo_sentinel2.png \
            data/maharlo_water.png \
            data/wetland-data.json

          git diff --cached --quiet || \
            git commit \
            -m "Update Maharloo water detection"

          git push
