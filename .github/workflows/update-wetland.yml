name: Find Latest Sentinel-2

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  find-image:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: pip install requests

      - name: Find Sentinel-2
        run: |
          python - <<'PY'
          import json
          import requests
          from datetime import datetime, timedelta, timezone

          GEOJSON_FILE = "bestar_talab_maharlo.geojson"
          OUTPUT_FILE = "data/wetland-data.json"

          # خواندن مرز تالاب
          with open(GEOJSON_FILE, "r", encoding="utf-8") as f:
              data = json.load(f)

          geometry = data["features"][0]["geometry"]

          # پیدا کردن محدوده تالاب
          all_points = []

          def collect(obj):
              if (
                  isinstance(obj, list)
                  and len(obj) >= 2
                  and isinstance(obj[0], (int, float))
                  and isinstance(obj[1], (int, float))
              ):
                  all_points.append((obj[0], obj[1]))
              elif isinstance(obj, list):
                  for x in obj:
                      collect(x)

          collect(geometry["coordinates"])

          min_lon = min(p[0] for p in all_points)
          min_lat = min(p[1] for p in all_points)
          max_lon = max(p[0] for p in all_points)
          max_lat = max(p[1] for p in all_points)

          # جست‌وجوی 30 روز اخیر
          now = datetime.now(timezone.utc)
          start = now - timedelta(days=30)

          request = {
              "collections": ["sentinel-2-l2a"],
              "datetime": f"{start.isoformat()}/{now.isoformat()}",
              "bbox": [
                  min_lon,
                  min_lat,
                  max_lon,
                  max_lat
              ],
              "query": {
                  "eo:cloud_cover": {
                      "lte": 20
                  }
              },
              "limit": 50,
              "sortby": [
                  {
                      "field": "properties.eo:cloud_cover",
                      "direction": "asc"
                  }
              ]
          }

          url = "https://stac.dataspace.copernicus.eu/v1/search"

          response = requests.post(
              url,
              json=request,
              timeout=120
          )

          response.raise_for_status()

          results = response.json()

          features = results.get("features", [])

          if not features:
              raise Exception(
                  "هیچ تصویر Sentinel-2 با ابر کمتر از 20 درصد پیدا نشد."
              )

          best = features[0]

          output = {
              "updated_at": datetime.now(timezone.utc).isoformat(),
              "image_id": best.get("id"),
              "date": best.get("properties", {}).get("datetime"),
              "cloud_cover": best.get("properties", {}).get("eo:cloud_cover"),
              "geometry": best.get("geometry"),
              "assets": best.get("assets", {}),
              "wetland_bbox": [
                  min_lon,
                  min_lat,
                  max_lon,
                  max_lat
              ]
          }

          import os
          os.makedirs("data", exist_ok=True)

          with open(OUTPUT_FILE, "w", encoding="utf-8") as f:
              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("================================")
          print("Sentinel-2 image found")
          print("ID:", output["image_id"])
          print("Date:", output["date"])
          print("Cloud:", output["cloud_cover"])
          print("================================")
          PY

      - name: Save result
        run: |
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/wetland-data.json

          git diff --cached --quiet || \
            git commit -m "Update Sentinel-2 data"

          git push
