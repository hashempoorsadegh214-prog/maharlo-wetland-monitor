name: Update Maharloo Wetland

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  update-wetland:

    runs-on: ubuntu-latest

    steps:

      - name: Get repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          pip install requests

      - name: Download Sentinel-2 and NDWI
        env:
          CDSE_CLIENT_ID: ${{ secrets.CDSE_CLIENT_ID }}
          CDSE_CLIENT_SECRET: ${{ secrets.CDSE_CLIENT_SECRET }}

        run: |

          python - <<'PY'

          import json
          import os
          import requests

          from datetime import datetime, timedelta, timezone


          # =========================================
          # فایل‌ها
          # =========================================

          GEOJSON_FILE = "bestar_talab_maharlo.geojson"

          RGB_FILE = "data/maharlo_sentinel2.png"

          NDWI_FILE = "data/maharlo_ndwi.png"

          INFO_FILE = "data/wetland-data.json"


          # =========================================
          # خواندن مرز تالاب
          # =========================================

          with open(
              GEOJSON_FILE,
              "r",
              encoding="utf-8"
          ) as f:

              geojson = json.load(f)


          geometry = geojson["features"][0]["geometry"]


          # =========================================
          # پیدا کردن BBOX
          # =========================================

          points = []


          def collect_points(obj):

              if (
                  isinstance(obj, list)
                  and len(obj) >= 2
                  and isinstance(obj[0], (int, float))
                  and isinstance(obj[1], (int, float))
              ):

                  points.append(
                      (obj[0], obj[1])
                  )

              elif isinstance(obj, list):

                  for item in obj:
                      collect_points(item)


          collect_points(
              geometry["coordinates"]
          )


          min_lon = min(
              p[0] for p in points
          )

          max_lon = max(
              p[0] for p in points
          )

          min_lat = min(
              p[1] for p in points
          )

          max_lat = max(
              p[1] for p in points
          )


          bbox = [
              min_lon,
              min_lat,
              max_lon,
              max_lat
          ]


          print("Wetland BBOX:")
          print(bbox)


          # =========================================
          # ورود به Copernicus
          # =========================================

          token_url = (
              "https://identity.dataspace.copernicus.eu/"
              "auth/realms/CDSE/protocol/openid-connect/token"
          )


          token_data = {

              "grant_type":
                  "client_credentials",

              "client_id":
                  os.environ["CDSE_CLIENT_ID"],

              "client_secret":
                  os.environ["CDSE_CLIENT_SECRET"]

          }


          token_response = requests.post(
              token_url,
              data=token_data,
              timeout=60
          )


          if token_response.status_code != 200:

              print(
                  token_response.text
              )

              raise Exception(
                  "Copernicus authentication failed"
              )


          access_token = (
              token_response
              .json()
              ["access_token"]
          )


          # =========================================
          # زمان جست‌وجو
          # =========================================

          now = datetime.now(
              timezone.utc
          )

          start = (
              now -
              timedelta(days=30)
          )


          # =========================================
          # آدرس Process API
          # =========================================

          process_url = (
              "https://sh.dataspace.copernicus.eu/"
              "process/v1"
          )


          headers = {

              "Authorization":
                  "Bearer " +
                  access_token,

              "Content-Type":
                  "application/json"

          }


          # =========================================
          # ۱- تصویر رنگی
          # =========================================

          rgb_evalscript = """

          //VERSION=3

          function setup() {

              return {

                  input: [
                      "B02",
                      "B03",
                      "B04"
                  ],

                  output: {

                      bands: 3,

                      sampleType:
                          "AUTO"

                  }

              };

          }


          function evaluatePixel(sample) {

              return [

                  2.5 * sample.B04,

                  2.5 * sample.B03,

                  2.5 * sample.B02

              ];

          }

          """


          rgb_request = {

              "input": {

                  "bounds": {

                      "properties": {

                          "crs":
                          "http://www.opengis.net/def/crs/OGC/1.3/CRS84"

                      },

                      "bbox":
                          bbox

                  },

                  "data": [

                      {

                          "type":
                              "sentinel-2-l2a",

                          "dataFilter": {

                              "timeRange": {

                                  "from":
                                      start.isoformat(),

                                  "to":
                                      now.isoformat()

                              },

                              "maxCloudCoverage":
                                  20,

                              "mosaickingOrder":
                                  "leastCC"

                          }

                      }

                  ]

              },

              "output": {

                  "width":
                      1200,

                  "height":
                      1200,

                  "responses": [

                      {

                          "identifier":
                              "default",

                          "format": {

                              "type":
                                  "image/png"

                          }

                      }

                  ]

              },

              "evalscript":
                  rgb_evalscript

          }


          print(
              "Downloading Sentinel-2 RGB..."
          )


          rgb_response = requests.post(

              process_url,

              headers=headers,

              json=rgb_request,

              timeout=300

          )


          print(
              "RGB HTTP:",
              rgb_response.status_code
          )


          if rgb_response.status_code != 200:

              print(
                  rgb_response.text[:3000]
              )

              raise Exception(
                  "RGB image request failed"
              )


          os.makedirs(
              "data",
              exist_ok=True
          )


          with open(
              RGB_FILE,
              "wb"
          ) as f:

              f.write(
                  rgb_response.content
              )


          print(
              "RGB image saved."
          )


          # =========================================
          # ۲- NDWI
          # =========================================

          ndwi_evalscript = """

          //VERSION=3

          function setup() {

              return {

                  input: [
                      "B03",
                      "B08",
                      "dataMask"
                  ],

                  output: {

                      bands: 4,

                      sampleType:
                          "AUTO"

                  }

              };

          }


          function evaluatePixel(sample) {

              let ndwi =
                  (sample.B03 - sample.B08) /
                  (sample.B03 + sample.B08);


              /*
                 فقط قسمت‌های با NDWI مثبت
                 نمایش داده شوند.
              */

              if (
                  sample.dataMask == 0 ||
                  ndwi <= 0
              ) {

                  return [
                      0,
                      0,
                      0,
                      0
                  ];

              }


              /*
                 نمایش آبی برای آب
              */

              let strength =
                  Math.min(
                      1,
                      ndwi / 0.6
                  );


              return [
                  0.1,
                  0.55 + (0.35 * strength),
                  1.0,
                  0.35 + (0.65 * strength)
              ];

          }

          """


          ndwi_request = {

              "input": {

                  "bounds": {

                      "properties": {

                          "crs":
                          "http://www.opengis.net/def/crs/OGC/1.3/CRS84"

                      },

                      "bbox":
                          bbox

                  },

                  "data": [

                      {

                          "type":
                              "sentinel-2-l2a",

                          "dataFilter": {

                              "timeRange": {

                                  "from":
                                      start.isoformat(),

                                  "to":
                                      now.isoformat()

                              },

                              "maxCloudCoverage":
                                  20,

                              "mosaickingOrder":
                                  "leastCC"

                          }

                      }

                  ]

              },

              "output": {

                  "width":
                      1200,

                  "height":
                      1200,

                  "responses": [

                      {

                          "identifier":
                              "default",

                          "format": {

                              "type":
                                  "image/png"

                          }

                      }

                  ]

              },

              "evalscript":
                  ndwi_evalscript

          }


          print(
              "Calculating NDWI..."
          )


          ndwi_response = requests.post(

              process_url,

              headers=headers,

              json=ndwi_request,

              timeout=300

          )


          print(
              "NDWI HTTP:",
              ndwi_response.status_code
          )


          if ndwi_response.status_code != 200:

              print(
                  ndwi_response.text[:3000]
              )

              raise Exception(
                  "NDWI request failed"
              )


          with open(
              NDWI_FILE,
              "wb"
          ) as f:

              f.write(
                  ndwi_response.content
              )


          print(
              "NDWI image saved."
          )


          # =========================================
          # اطلاعات
          # =========================================

          info = {

              "updated_at":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "image":
              {

                  "file":
                      "data/maharlo_sentinel2.png",

                  "bbox":
                      bbox,

                  "type":
                      "Sentinel-2 L2A",

                  "max_cloud":
                      20,

                  "period_days":
                      30

              },

              "ndwi":
              {

                  "file":
                      "data/maharlo_ndwi.png",

                  "formula":
                      "(B03 - B08) / (B03 + B08)",

                  "green_band":
                      "B03",

                  "nir_band":
                      "B08",

                  "threshold":
                      0

              }

          }


          with open(
              INFO_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  info,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          print(
              "NDWI CREATED SUCCESSFULLY"
          )

          PY


      - name: Save files
        run: |

          git config user.name "github-actions"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/maharlo_sentinel2.png \
            data/maharlo_ndwi.png \
            data/wetland-data.json

          git diff --cached --quiet || \
            git commit \
            -m "Add NDWI layer for Maharloo wetland"

          git push
