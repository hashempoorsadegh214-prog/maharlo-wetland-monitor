name: Update Maharloo Wetland

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  update-wetland:
    runs-on: ubuntu-latest

    steps:

      - name: Get repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          pip install requests pillow shapely pyproj

      - name: Download image and calculate water area
        env:
          CDSE_CLIENT_ID: ${{ secrets.CDSE_CLIENT_ID }}
          CDSE_CLIENT_SECRET: ${{ secrets.CDSE_CLIENT_SECRET }}

        run: |

          python - <<'PY'

          import json
          import os
          import requests

          from datetime import datetime, timedelta, timezone

          from PIL import Image

          from shapely.geometry import shape

          from pyproj import Transformer


          # =====================================================
          # فایل‌ها
          # =====================================================

          GEOJSON_FILE = "bestar_talab_maharlo.geojson"

          RGB_FILE = "data/maharlo_sentinel2.png"

          WATER_FILE = "data/maharlo_water.png"

          INFO_FILE = "data/wetland-data.json"


          # =====================================================
          # پارامترها
          # =====================================================

          MAX_CLOUD = 20

          DAYS_BACK = 30

          PIXEL_SIZE_M = 20

          PIXEL_AREA_M2 = (
              PIXEL_SIZE_M *
              PIXEL_SIZE_M
          )

          PIXEL_AREA_HA = (
              PIXEL_AREA_M2 / 10000
          )


          # =====================================================
          # خواندن مرز تالاب
          # =====================================================

          with open(
              GEOJSON_FILE,
              "r",
              encoding="utf-8"
          ) as f:

              geojson = json.load(f)


          geometry = geojson["features"][0]["geometry"]

          wetland = shape(
              geometry
          ).buffer(0)


          # =====================================================
          # تبدیل WGS84 به UTM Zone 39N
          #
          # مهارلو در این محدوده قرار دارد.
          # =====================================================

          to_utm = Transformer.from_crs(
              "EPSG:4326",
              "EPSG:32639",
              always_xy=True
          ).transform


          wetland_utm = (
              __import__("shapely").ops.transform(
                  to_utm,
                  wetland
              )
          )


          minx, miny, maxx, maxy = (
              wetland_utm.bounds
          )


          # عرض و ارتفاع بر حسب متر

          width_m = maxx - minx

          height_m = maxy - miny


          # تعداد پیکسل‌ها با اندازه 20 متر

          width_px = int(
              round(
                  width_m /
                  PIXEL_SIZE_M
              )
          )

          height_px = int(
              round(
                  height_m /
                  PIXEL_SIZE_M
              )
          )


          print(
              "UTM width:",
              width_m
          )

          print(
              "UTM height:",
              height_m
          )

          print(
              "Output size:",
              width_px,
              "x",
              height_px
          )


          # =====================================================
          # BBOX جغرافیایی برای RGB
          # =====================================================

          min_lon, min_lat, max_lon, max_lat = (
              wetland.bounds
          )


          rgb_bbox = [
              min_lon,
              min_lat,
              max_lon,
              max_lat
          ]


          # =====================================================
          # گرفتن Token
          # =====================================================

          token_url = (
              "https://identity.dataspace.copernicus.eu/"
              "auth/realms/CDSE/protocol/openid-connect/token"
          )


          token_response = requests.post(

              token_url,

              data={
                  "grant_type":
                      "client_credentials",

                  "client_id":
                      os.environ["CDSE_CLIENT_ID"],

                  "client_secret":
                      os.environ["CDSE_CLIENT_SECRET"]
              },

              timeout=60
          )


          if token_response.status_code != 200:

              print(
                  token_response.text
              )

              raise Exception(
                  "Copernicus authentication failed"
              )


          access_token = (
              token_response
              .json()
              ["access_token"]
          )


          print(
              "Copernicus authentication OK"
          )


          # =====================================================
          # زمان
          # =====================================================

          now = datetime.now(
              timezone.utc
          )

          start = (
              now -
              timedelta(
                  days=DAYS_BACK
              )
          )


          process_url = (
              "https://sh.dataspace.copernicus.eu/"
              "process/v1"
          )


          headers = {

              "Authorization":
                  "Bearer " +
                  access_token,

              "Content-Type":
                  "application/json"
          }


          # =====================================================
          # RGB
          # =====================================================

          rgb_evalscript = """

          //VERSION=3

          function setup() {

              return {

                  input: [
                      "B02",
                      "B03",
                      "B04"
                  ],

                  output: {

                      bands: 3,

                      sampleType:
                          "AUTO"

                  }

              };

          }


          function evaluatePixel(sample) {

              return [

                  2.5 * sample.B04,

                  2.5 * sample.B03,

                  2.5 * sample.B02

              ];

          }

          """


          rgb_request = {

              "input": {

                  "bounds": {

                      "properties": {

                          "crs":
                          "http://www.opengis.net/def/crs/OGC/1.3/CRS84"

                      },

                      "bbox":
                          rgb_bbox

                  },

                  "data": [

                      {

                          "type":
                              "sentinel-2-l2a",

                          "dataFilter": {

                              "timeRange": {

                                  "from":
                                      start.isoformat(),

                                  "to":
                                      now.isoformat()

                              },

                              "maxCloudCoverage":
                                  MAX_CLOUD,

                              "mosaickingOrder":
                                  "leastCC"

                          }

                      }

                  ]

              },

              "output": {

                  "width":
                      1200,

                  "height":
                      1200,

                  "responses": [

                      {

                          "identifier":
                              "default",

                          "format": {

                              "type":
                                  "image/png"

                          }

                      }

                  ]

              },

              "evalscript":
                  rgb_evalscript
          }


          rgb_response = requests.post(

              process_url,

              headers=headers,

              json=rgb_request,

              timeout=300
          )


          if rgb_response.status_code != 200:

              print(
                  rgb_response.text[:3000]
              )

              raise Exception(
                  "RGB request failed"
              )


          os.makedirs(
              "data",
              exist_ok=True
          )


          with open(
              RGB_FILE,
              "wb"
          ) as f:

              f.write(
                  rgb_response.content
              )


          print(
              "RGB image saved."
          )


          # =====================================================
          # MNDWI + AWEI
          #
          # خروجی در UTM و 20 متر
          # =====================================================

          water_evalscript = """

          //VERSION=3

          function setup() {

              return {

                  input: [
                      "B03",
                      "B08",
                      "B11",
                      "B12"
                  ],

                  output: {

                      bands: 4,

                      sampleType: "AUTO"

                  }

              };

          }


          function evaluatePixel(sample) {

              let mndwi =
                  (sample.B03 - sample.B11) /
                  (sample.B03 + sample.B11);


              let awei =
                  4 * (
                      sample.B03 -
                      sample.B11
                  ) -
                  (
                      0.25 *
                      sample.B08
                      +
                      2.75 *
                      sample.B12
                  );


              if (
                  awei > -0.1 &&
                  mndwi > 0
              ) {

                  return [
                      0.0,
                      0.25,
                      1.0,
                      1.0
                  ];

              }


              return [
                  0.0,
                  0.0,
                  0.0,
                  0.0
              ];

          }

          """


          water_request = {

              "input": {

                  "bounds": {

                      "properties": {

                          "crs":
                          "http://www.opengis.net/def/crs/EPSG/0/32639"

                      },

                      "bbox": [

                          minx,
                          miny,
                          maxx,
                          maxy

                      ]

                  },

                  "data": [

                      {

                          "type":
                              "sentinel-2-l2a",

                          "dataFilter": {

                              "timeRange": {

                                  "from":
                                      start.isoformat(),

                                  "to":
                                      now.isoformat()

                              },

                              "maxCloudCoverage":
                                  MAX_CLOUD,

                              "mosaickingOrder":
                                  "leastCC"

                          }

                      }

                  ]

              },

              "output": {

                  "width":
                      width_px,

                  "height":
                      height_px,

                  "responses": [

                      {

                          "identifier":
                              "default",

                          "format": {

                              "type":
                                  "image/png"

                          }

                      }

                  ]

              },

              "evalscript":
                  water_evalscript
          }


          print(
              "Calculating water layer..."
          )


          water_response = requests.post(

              process_url,

              headers=headers,

              json=water_request,

              timeout=300
          )


          print(
              "Water HTTP:",
              water_response.status_code
          )


          if water_response.status_code != 200:

              print(
                  water_response.text[:3000]
              )

              raise Exception(
                  "Water request failed"
              )


          with open(
              WATER_FILE,
              "wb"
          ) as f:

              f.write(
                  water_response.content
              )


          print(
              "Water image saved."
          )


          # =====================================================
          # شمارش پیکسل‌های آب
          #
          # PNG چهار کاناله است:
          # RGB + Alpha
          #
          # Alpha > 0 یعنی آب تشخیص داده شده
          # =====================================================

          image = Image.open(
              WATER_FILE
          ).convert("RGBA")


          pixels = image.load()


          water_pixels = 0

          total_pixels = (
              image.width *
              image.height
          )


          for y in range(
              image.height
          ):

              for x in range(
                  image.width
              ):

                  alpha = pixels[x, y][3]

                  if alpha > 0:

                      water_pixels += 1


          # =====================================================
          # محاسبه مساحت
          # =====================================================

          water_area_m2 = (
              water_pixels *
              PIXEL_AREA_M2
          )


          water_area_ha = (
              water_area_m2 /
              10000
          )


          print(
              "Water pixels:",
              water_pixels
          )

          print(
              "Water area m2:",
              water_area_m2
          )

          print(
              "Water area ha:",
              water_area_ha
          )


          # =====================================================
          # ذخیره اطلاعات
          # =====================================================

          info = {

              "updated_at":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "image": {

                  "file":
                      "data/maharlo_sentinel2.png",

                  "bbox":
                      rgb_bbox,

                  "type":
                      "Sentinel-2 L2A",

                  "max_cloud":
                      MAX_CLOUD,

                  "period_days":
                      DAYS_BACK
              },

              "water": {

                  "file":
                      "data/maharlo_water.png",

                  "method":
                      "MNDWI + AWEI",

                  "mndwi":
                      "(B03 - B11) / (B03 + B11)",

                  "awei":
                      "4*(B03-B11) - (0.25*B08 + 2.75*B12)",

                  "condition":
                      "AWEI > -0.1 AND MNDWI > 0",

                  "pixel_size_m":
                      PIXEL_SIZE_M,

                  "pixel_area_ha":
                      PIXEL_AREA_HA,

                  "water_pixels":
                      water_pixels,

                  "water_area_m2":
                      water_area_m2,

                  "water_area_ha":
                      round(
                          water_area_ha,
                          2
                      )

              }

          }


          with open(
              INFO_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  info,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          print("")
          print(
              "======================================"
          )

          print(
              "WATER AREA CALCULATED"
          )

          print(
              "Area:",
              round(
                  water_area_ha,
                  2
              ),
              "hectares"
          )

          print(
              "======================================"
          )

          PY


      - name: Save files
        run: |

          git config user.name "github-actions"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/maharlo_sentinel2.png \
            data/maharlo_water.png \
            data/wetland-data.json

          git diff --cached --quiet || \
            git commit \
            -m "Calculate Maharloo water area"

          git push
