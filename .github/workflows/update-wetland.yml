name: Update Wetland Sentinel-2

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  update-wetland:
    runs-on: ubuntu-latest

    steps:

      - name: Get repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          pip install requests shapely pillow

      - name: Download and clip Sentinel-2
        env:
          CDSE_CLIENT_ID: ${{ secrets.CDSE_CLIENT_ID }}
          CDSE_CLIENT_SECRET: ${{ secrets.CDSE_CLIENT_SECRET }}

        run: |

          python - <<'PY'

          import json
          import os
          import requests

          from datetime import datetime, timedelta, timezone
          from PIL import Image, ImageDraw
          from shapely.geometry import shape


          # =========================================
          # فایل‌ها
          # =========================================

          GEOJSON_FILE = "bestar_talab_maharlo.geojson"

          IMAGE_FILE = "data/maharlo_sentinel2.png"

          INFO_FILE = "data/wetland-data.json"


          # =========================================
          # خواندن مرز تالاب
          # =========================================

          with open(
              GEOJSON_FILE,
              "r",
              encoding="utf-8"
          ) as f:

              geojson = json.load(f)


          geometry = geojson["features"][0]["geometry"]


          # حذف Z
          def remove_z(obj):

              if isinstance(obj, list):

                  if (
                      len(obj) >= 2
                      and isinstance(obj[0], (int, float))
                      and isinstance(obj[1], (int, float))
                  ):

                      return [
                          obj[0],
                          obj[1]
                      ]

                  return [
                      remove_z(item)
                      for item in obj
                  ]

              return obj


          geometry_2d = {
              "type": geometry["type"],
              "coordinates": remove_z(
                  geometry["coordinates"]
              )
          }


          polygon = shape(
              geometry_2d
          ).buffer(0)


          # =========================================
          # محدوده تالاب
          # =========================================

          minx, miny, maxx, maxy = polygon.bounds

          bbox = [
              minx,
              miny,
              maxx,
              maxy
          ]


          print("Wetland BBOX:")
          print(bbox)


          # =========================================
          # گرفتن Access Token
          # =========================================

          token_url = (
              "https://identity.dataspace.copernicus.eu/"
              "auth/realms/CDSE/protocol/openid-connect/token"
          )


          token_data = {

              "grant_type":
                  "client_credentials",

              "client_id":
                  os.environ[
                      "CDSE_CLIENT_ID"
                  ],

              "client_secret":
                  os.environ[
                      "CDSE_CLIENT_SECRET"
                  ]
          }


          token_response = requests.post(

              token_url,

              data=token_data,

              timeout=60
          )


          if token_response.status_code != 200:

              print(
                  token_response.text
              )

              raise Exception(
                  "Copernicus authentication failed"
              )


          access_token = (
              token_response
              .json()
              ["access_token"]
          )


          # =========================================
          # بازه زمانی
          # =========================================

          now = datetime.now(
              timezone.utc
          )

          start = (
              now -
              timedelta(days=30)
          )


          # =========================================
          # درخواست Sentinel-2
          # =========================================

          process_url = (
              "https://sh.dataspace.copernicus.eu/"
              "process/v1"
          )


          evalscript = """

          //VERSION=3

          function setup() {

              return {

                  input: [
                      "B02",
                      "B03",
                      "B04"
                  ],

                  output: {

                      bands: 3,

                      sampleType:
                          "AUTO"

                  }

              };

          }


          function evaluatePixel(sample) {

              return [

                  2.5 * sample.B04,

                  2.5 * sample.B03,

                  2.5 * sample.B02

              ];

          }

          """


          request_body = {

              "input": {

                  "bounds": {

                      "properties": {

                          "crs":
                          "http://www.opengis.net/def/crs/OGC/1.3/CRS84"

                      },

                      "bbox":
                          bbox
                  },


                  "data": [

                      {

                          "type":
                              "sentinel-2-l2a",

                          "dataFilter": {

                              "timeRange": {

                                  "from":
                                      start.isoformat(),

                                  "to":
                                      now.isoformat()

                              },

                              "maxCloudCoverage":
                                  20,

                              "mosaickingOrder":
                                  "leastCC"

                          }

                      }

                  ]

              },


              "output": {

                  "width":
                      1200,

                  "height":
                      1200,

                  "responses": [

                      {

                          "identifier":
                              "default",

                          "format": {

                              "type":
                                  "image/png"

                          }

                      }

                  ]

              },

              "evalscript":
                  evalscript

          }


          headers = {

              "Authorization":
                  "Bearer " +
                  access_token,

              "Content-Type":
                  "application/json"

          }


          print(
              "Downloading Sentinel-2..."
          )


          response = requests.post(

              process_url,

              headers=headers,

              json=request_body,

              timeout=300
          )


          print(
              "HTTP:",
              response.status_code
          )


          if response.status_code != 200:

              print(
                  response.text[:2000]
              )

              raise Exception(
                  "Sentinel-2 download failed"
              )


          # =========================================
          # ذخیره تصویر اولیه
          # =========================================

          temp_file = (
              "data/sentinel_temp.png"
          )


          os.makedirs(
              "data",
              exist_ok=True
          )


          with open(
              temp_file,
              "wb"
          ) as f:

              f.write(
                  response.content
              )


          # =========================================
          # برش دقیق با مرز تالاب
          # =========================================

          print(
              "Clipping image to wetland boundary..."
          )


          image = Image.open(
              temp_file
          ).convert("RGBA")


          width, height = image.size


          # ماسک شفاف
          mask = Image.new(
              "L",
              (width, height),
              0
          )


          draw = ImageDraw.Draw(
              mask
          )


          def lon_to_x(lon):

              return int(
                  (
                      (lon - minx)
                      /
                      (maxx - minx)
                  )
                  * (width - 1)
              )


          def lat_to_y(lat):

              return int(
                  (
                      (maxy - lat)
                      /
                      (maxy - miny)
                  )
                  * (height - 1)
              )


          def draw_polygon(poly):

              # قسمت بیرونی
              exterior = [

                  (
                      lon_to_x(x),
                      lat_to_y(y)
                  )

                  for x, y in
                  poly.exterior.coords

              ]

              draw.polygon(
                  exterior,
                  fill=255
              )


              # سوراخ‌ها
              for interior in poly.interiors:

                  hole = [

                      (
                          lon_to_x(x),
                          lat_to_y(y)
                      )

                      for x, y in
                      interior.coords

                  ]

                  draw.polygon(
                      hole,
                      fill=0
                  )


          if polygon.geom_type == "Polygon":

              draw_polygon(
                  polygon
              )


          elif polygon.geom_type == "MultiPolygon":

              for part in polygon.geoms:

                  draw_polygon(
                      part
                  )


          # اعمال شفافیت
          image.putalpha(
              mask
          )


          # ذخیره تصویر نهایی
          image.save(
              IMAGE_FILE,
              "PNG"
          )


          # حذف فایل موقت
          if os.path.exists(
              temp_file
          ):

              os.remove(
                  temp_file
              )


          # =========================================
          # ذخیره اطلاعات
          # =========================================

          info = {

              "updated_at":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "image":
              {

                  "file":
                      "data/maharlo_sentinel2.png",

                  "bbox":
                      bbox,

                  "max_cloud":
                      20,

                  "period_days":
                      30,

                  "type":
                      "Sentinel-2 L2A",

                  "bands":
                      [
                          "B04",
                          "B03",
                          "B02"
                      ],

                  "clipped":
                      True
              }

          }


          with open(
              INFO_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  info,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          print(
              "Sentinel-2 image clipped successfully."
          )

          PY


      # =========================================
      # ذخیره فایل‌ها
      # =========================================

      - name: Save files
        run: |

          git config user.name "github-actions"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/maharlo_sentinel2.png \
            data/wetland-data.json

          git diff --cached --quiet || \
            git commit \
            -m "Clip Sentinel-2 to Maharloo wetland"

          git push
