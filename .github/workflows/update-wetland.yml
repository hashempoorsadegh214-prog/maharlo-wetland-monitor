name: Update Maharloo Wetland

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  update-wetland:

    runs-on: ubuntu-latest

    steps:

      - name: Get repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          pip install requests pillow

      - name: Download Sentinel-2 image
        env:
          CDSE_CLIENT_ID: ${{ secrets.CDSE_CLIENT_ID }}
          CDSE_CLIENT_SECRET: ${{ secrets.CDSE_CLIENT_SECRET }}

        run: |

          python - <<'PY'

          import json
          import os
          import requests

          from datetime import datetime, timedelta, timezone


          # =====================================================
          # فایل‌ها
          # =====================================================

          GEOJSON_FILE = "bestar_talab_maharlo.geojson"

          RGB_FILE = "data/maharlo_sentinel2.png"

          INFO_FILE = "data/wetland-data.json"


          # =====================================================
          # خواندن مرز تالاب
          # =====================================================

          with open(
              GEOJSON_FILE,
              "r",
              encoding="utf-8"
          ) as f:

              geojson = json.load(f)


          geometry = geojson["features"][0]["geometry"]


          # =====================================================
          # پیدا کردن BBOX
          # =====================================================

          points = []


          def collect_points(obj):

              if (
                  isinstance(obj, list)
                  and len(obj) >= 2
                  and isinstance(obj[0], (int, float))
                  and isinstance(obj[1], (int, float))
              ):

                  points.append(
                      (obj[0], obj[1])
                  )

              elif isinstance(obj, list):

                  for item in obj:
                      collect_points(item)


          collect_points(
              geometry["coordinates"]
          )


          min_lon = min(
              p[0] for p in points
          )

          max_lon = max(
              p[0] for p in points
          )

          min_lat = min(
              p[1] for p in points
          )

          max_lat = max(
              p[1] for p in points
          )


          bbox = [
              min_lon,
              min_lat,
              max_lon,
              max_lat
          ]


          print("Wetland BBOX:")
          print(bbox)


          # =====================================================
          # دریافت Access Token
          # =====================================================

          token_url = (
              "https://identity.dataspace.copernicus.eu/"
              "auth/realms/CDSE/protocol/openid-connect/token"
          )


          token_data = {

              "grant_type":
                  "client_credentials",

              "client_id":
                  os.environ["CDSE_CLIENT_ID"],

              "client_secret":
                  os.environ["CDSE_CLIENT_SECRET"]

          }


          token_response = requests.post(

              token_url,

              data=token_data,

              timeout=60

          )


          if token_response.status_code != 200:

              print(
                  token_response.text
              )

              raise Exception(
                  "Copernicus authentication failed"
              )


          access_token = (
              token_response
              .json()
              ["access_token"]
          )


          print(
              "Copernicus authentication OK"
          )


          # =====================================================
          # بازه زمانی
          # =====================================================

          now = datetime.now(
              timezone.utc
          )

          start = (
              now -
              timedelta(days=30)
          )


          # =====================================================
          # Evalscript تصویر طبیعی
          #
          # B04 = قرمز
          # B03 = سبز
          # B02 = آبی
          # =====================================================

          evalscript = """

          //VERSION=3

          function setup() {

              return {

                  input: [
                      "B02",
                      "B03",
                      "B04"
                  ],

                  output: {

                      bands: 3,

                      sampleType:
                          "AUTO"

                  }

              };

          }


          function evaluatePixel(sample) {

              return [

                  2.5 * sample.B04,

                  2.5 * sample.B03,

                  2.5 * sample.B02

              ];

          }

          """


          # =====================================================
          # درخواست تصویر
          # =====================================================

          process_url = (
              "https://sh.dataspace.copernicus.eu/"
              "process/v1"
          )


          request_body = {

              "input": {

                  "bounds": {

                      "properties": {

                          "crs":
                          "http://www.opengis.net/def/crs/OGC/1.3/CRS84"

                      },

                      "bbox":
                          bbox

                  },

                  "data": [

                      {

                          "type":
                              "sentinel-2-l2a",

                          "dataFilter": {

                              "timeRange": {

                                  "from":
                                      start.isoformat(),

                                  "to":
                                      now.isoformat()

                              },

                              "maxCloudCoverage":
                                  20,

                              "mosaickingOrder":
                                  "leastCC"

                          }

                      }

                  ]

              },


              "output": {

                  "width":
                      1200,

                  "height":
                      1200,

                  "responses": [

                      {

                          "identifier":
                              "default",

                          "format": {

                              "type":
                                  "image/png"

                          }

                      }

                  ]

              },


              "evalscript":
                  evalscript

          }


          headers = {

              "Authorization":
                  "Bearer " +
                  access_token,

              "Content-Type":
                  "application/json"

          }


          print(
              "Downloading Sentinel-2 image..."
          )


          response = requests.post(

              process_url,

              headers=headers,

              json=request_body,

              timeout=300

          )


          print(
              "HTTP:",
              response.status_code
          )

          print(
              "Content-Type:",
              response.headers.get(
                  "Content-Type",
                  ""
              )
          )


          if response.status_code != 200:

              print(
                  response.text[:3000]
              )

              raise Exception(
                  "Sentinel-2 request failed"
              )


          # =====================================================
          # ذخیره مستقیم PNG
          # =====================================================

          if not response.headers.get(
              "Content-Type",
              ""
          ).lower().startswith(
              "image/png"
          ):

              raise Exception(
                  "Copernicus did not return PNG image."
              )


          os.makedirs(
              "data",
              exist_ok=True
          )


          with open(
              RGB_FILE,
              "wb"
          ) as f:

              f.write(
                  response.content
              )


          print(
              "Sentinel-2 PNG saved."
          )


          # =====================================================
          # ذخیره اطلاعات
          # =====================================================

          info = {

              "updated_at":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "image":
              {

                  "file":
                      "data/maharlo_sentinel2.png",

                  "bbox":
                      bbox,

                  "type":
                      "Sentinel-2 L2A",

                  "max_cloud":
                      20,

                  "period_days":
                      30,

                  "bands":
                      [
                          "B04",
                          "B03",
                          "B02"
                      ]

              }

          }


          with open(
              INFO_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  info,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          print("")
          print(
              "======================================"
          )
          print(
              "SENTINEL-2 IMAGE CREATED SUCCESSFULLY"
          )
          print(
              "======================================"
          )

          PY


      - name: Save files
        run: |

          git config user.name "github-actions"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/maharlo_sentinel2.png \
            data/wetland-data.json

          git diff --cached --quiet || \
            git commit \
            -m "Update Maharloo Sentinel-2 image"

          git push
