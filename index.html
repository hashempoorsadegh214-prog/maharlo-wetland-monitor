<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>سامانه پایش تالاب مهارلو</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Tahoma, Arial, sans-serif;
            background: #f4f6f8;
        }

        header {
            height: 60px;
            background: #f28c28;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
        }

        #map {
            width: 100%;
            height: calc(100vh - 60px);
        }

        .panel {
            position: absolute;
            top: 75px;
            right: 15px;
            z-index: 1000;
            width: 320px;
            max-width: calc(100% - 30px);
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.2);
            line-height: 1.8;
        }

        .title {
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 17px;
        }

        .status {
            color: #067647;
            font-size: 13px;
        }

        .error {
            color: #b42318;
        }

        .info {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #ddd;
            font-size: 13px;
        }
    </style>
</head>

<body>

<header>
    سامانه پایش تالاب مهارلو
</header>

<div id="map"></div>

<div class="panel">

    <div class="title">
        آخرین تصویر Sentinel-2
    </div>

    <div id="status" class="status">
        در حال بارگذاری...
    </div>

    <div id="info" class="info" style="display:none;">

        <div>
            نوع تصویر:
            <b id="type">---</b>
        </div>

        <div>
            حداکثر ابر:
            <b id="cloud">---</b>
        </div>

        <div>
            بازه جست‌وجو:
            <b id="days">---</b> روز
        </div>

    </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map = L.map("map").setView(
    [29.43, 52.82],
    10
);

L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        attribution: "&copy; OpenStreetMap contributors"
    }
).addTo(map);

const statusEl =
    document.getElementById("status");

const infoEl =
    document.getElementById("info");

const typeEl =
    document.getElementById("type");

const cloudEl =
    document.getElementById("cloud");

const daysEl =
    document.getElementById("days");

async function loadSite() {

    try {

        const geoResponse =
            await fetch(
                "bestar_talab_maharlo.geojson?" +
                Date.now()
            );

        if (!geoResponse.ok) {
            throw new Error(
                "فایل مرز تالاب پیدا نشد."
            );
        }

        const geojson =
            await geoResponse.json();

        const wetlandLayer =
            L.geoJSON(
                geojson,
                {
                    style: {
                        color: "#0066ff",
                        weight: 3,
                        fillColor: "#00aaff",
                        fillOpacity: 0.12
                    }
                }
            ).addTo(map);

        const wetlandBounds =
            wetlandLayer.getBounds();

        if (wetlandBounds.isValid()) {
            map.fitBounds(
                wetlandBounds,
                {
                    padding: [20, 20]
                }
            );
        }

        const dataResponse =
            await fetch(
                "data/wetland-data.json?" +
                Date.now()
            );

        if (!dataResponse.ok) {
            throw new Error(
                "فایل اطلاعات Sentinel-2 پیدا نشد."
            );
        }

        const data =
            await dataResponse.json();

        if (
            !data.image ||
            !data.image.file ||
            !data.image.bbox
        ) {
            throw new Error(
                "اطلاعات تصویر Sentinel-2 کامل نیست."
            );
        }

        typeEl.textContent =
            data.image.type ||
            "Sentinel-2 L2A";

        cloudEl.textContent =
            data.image.max_cloud != null
                ? data.image.max_cloud + "%"
                : "---";

        daysEl.textContent =
            data.image.period_days != null
                ? data.image.period_days
                : "---";

        infoEl.style.display =
            "block";

        const imageURL =
            data.image.file +
            "?" +
            Date.now();

        const image =
            await loadImage(imageURL);

        const clippedImageURL =
            createClippedImage(
                image,
                geojson,
                data.image.bbox
            );

        const bbox =
            data.image.bbox;

        const imageBounds = [
            [bbox[1], bbox[0]],
            [bbox[3], bbox[2]]
        ];

        const imageLayer =
            L.imageOverlay(
                clippedImageURL,
                imageBounds,
                {
                    opacity: 0.85,
                    interactive: false
                }
            ).addTo(map);

        wetlandLayer.bringToFront();

        statusEl.textContent =
            "تصویر Sentinel-2 فقط داخل محدوده تالاب نمایش داده شد.";

        statusEl.className =
            "status";

    }

    catch (error) {

        console.error(error);

        statusEl.textContent =
            error.message;

        statusEl.className =
            "status error";
    }
}

function loadImage(url) {

    return new Promise(
        (resolve, reject) => {

            const img =
                new Image();

            img.onload =
                function() {
                    resolve(img);
                };

            img.onerror =
                function() {
                    reject(
                        new Error(
                            "تصویر Sentinel-2 قابل بارگذاری نیست."
                        )
                    );
                };

            img.src = url;
        }
    );
}

function createClippedImage(
    image,
    geojson,
    bbox
) {

    const canvas =
        document.createElement("canvas");

    const width =
        image.naturalWidth ||
        image.width;

    const height =
        image.naturalHeight ||
        image.height;

    canvas.width = width;
    canvas.height = height;

    const ctx =
        canvas.getContext("2d");

    ctx.drawImage(
        image,
        0,
        0,
        width,
        height
    );

    const minLon = bbox[0];
    const minLat = bbox[1];
    const maxLon = bbox[2];
    const maxLat = bbox[3];

    function lonToX(lon) {

        return (
            (lon - minLon) /
            (maxLon - minLon)
        ) * width;
    }

    function latToY(lat) {

        return (
            (maxLat - lat) /
            (maxLat - minLat)
        ) * height;
    }

    const maskCanvas =
        document.createElement("canvas");

    maskCanvas.width = width;
    maskCanvas.height = height;

    const maskCtx =
        maskCanvas.getContext("2d");

    function drawPolygon(
        polygonCoordinates
    ) {

        maskCtx.beginPath();

        for (
            const ring
            of polygonCoordinates
        ) {

            if (
                !ring ||
                ring.length < 3
            ) {
                continue;
            }

            const first =
                ring[0];

            maskCtx.moveTo(
                lonToX(first[0]),
                latToY(first[1])
            );

            for (
                let i = 1;
                i < ring.length;
                i++
            ) {

                const point =
                    ring[i];

                maskCtx.lineTo(
                    lonToX(point[0]),
                    latToY(point[1])
                );
            }

            maskCtx.closePath();
        }

        maskCtx.fill("evenodd");
    }

    const feature =
        geojson.features &&
        geojson.features.length > 0
            ? geojson.features[0]
            : null;

    if (!feature) {
        throw new Error(
            "هندسه تالاب پیدا نشد."
        );
    }

    const geometry =
        feature.geometry;

    maskCtx.fillStyle = "#ffffff";

    if (
        geometry.type === "Polygon"
    ) {

        drawPolygon(
            geometry.coordinates
        );

    } else if (
        geometry.type === "MultiPolygon"
    ) {

        for (
            const polygon
            of geometry.coordinates
        ) {

            drawPolygon(
                polygon
            );
        }

    } else {

        throw new Error(
            "نوع هندسه تالاب پشتیبانی نمی‌شود."
        );
    }

    ctx.globalCompositeOperation =
        "destination-in";

    ctx.drawImage(
        maskCanvas,
        0,
        0
    );

    ctx.globalCompositeOperation =
        "source-over";

    return canvas.toDataURL(
        "image/png"
    );
}

loadSite();

</script>

</body>
</html>
