<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        سامانه پایش تالاب مهارلو
    </title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            font-family:
                Tahoma,
                Arial,
                sans-serif;

        }

        header {

            height: 60px;

            background: #f28c28;

            color: white;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 20px;

            font-weight: bold;

        }

        #map {

            width: 100%;

            height:
                calc(
                    100vh - 60px
                );

        }

        .panel {

            position: absolute;

            top: 75px;

            right: 15px;

            z-index: 1000;

            width: 350px;

            max-width:
                calc(
                    100% - 30px
                );

            background: white;

            padding: 16px;

            border-radius: 13px;

            box-shadow:
                0 3px 15px
                rgba(
                    0,
                    0,
                    0,
                    .20
                );

        }

        .title {

            font-size: 18px;

            font-weight: bold;

            margin-bottom: 12px;

        }

        .big-date {

            text-align: center;

            font-size: 20px;

            font-weight: bold;

            margin:
                8px 0
                12px;

        }

        .water-title {

            text-align: center;

            font-size: 12px;

            color: #555;

        }

        .water-value {

            text-align: center;

            font-size: 29px;

            font-weight: bold;

            margin-top: 4px;

        }

        .row {

            display: flex;

            justify-content:
                space-between;

            border-bottom:
                1px solid #eee;

            padding:
                6px 0;

            font-size: 13px;

        }

        .slider {

            width: 100%;

            margin-top: 15px;

        }

        .slider-labels {

            display: flex;

            justify-content:
                space-between;

            gap: 4px;

            overflow-x: auto;

            margin-top: 8px;

        }

        .date-label {

            white-space:
                nowrap;

            font-size: 10px;

            color: #555;

        }

        .button {

            width: 100%;

            margin-top: 12px;

            padding: 10px;

            border: none;

            border-radius: 8px;

            background:
                #0066ff;

            color: white;

            font-family:
                inherit;

            cursor:
                pointer;

        }

        .button.active {

            background:
                #0050b8;

        }

        .status {

            margin-top: 8px;

            font-size: 12px;

        }

        .error {

            color:
                #b42318;

        }

        @media (
            max-width: 600px
        ) {

            .panel {

                top: 70px;

                right: 10px;

                left: 10px;

                width:
                    auto;

            }

        }

    </style>

</head>


<body>


<header>

    سامانه پایش تالاب مهارلو

</header>


<div id="map"></div>


<div class="panel">


    <div class="title">

        پایش آبگیری تالاب

    </div>


    <div
        class="big-date"
        id="selectedDate"
    >
        ---
    </div>


    <div class="water-title">

        میزان آبگیری

    </div>


    <div
        class="water-value"
        id="waterArea"
    >
        ---
    </div>


    <div
        class="water-title"
    >

        هکتار

    </div>


    <div class="row">

        <span>
            پوشش ابر
        </span>

        <b id="cloud">
            ---
        </b>

    </div>


    <input
        id="dateSlider"
        class="slider"
        type="range"
        min="0"
        max="0"
        value="0"
    >


    <div
        id="dateLabels"
        class="slider-labels"
    ></div>


    <button
        id="waterButton"
        class="button"
        onclick="toggleWater()"
    >

        نمایش محدوده آب

    </button>


    <div
        id="status"
        class="status"
    >

        در حال بارگذاری...

    </div>


</div>


<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
></script>


<script>


/* =====================================================
   نقشه
===================================================== */


const map =
    L.map(
        "map"
    ).setView(
        [
            29.43,
            52.82
        ],
        10
    );


L.tileLayer(

    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

    {

        attribution:
            "&copy; OpenStreetMap contributors"

    }

).addTo(
    map
);


/* =====================================================
   متغیرها
===================================================== */


let wetlandLayer =
    null;

let rgbLayer =
    null;

let waterLayer =
    null;

let archive =
    null;

let selectedItem =
    null;

let waterVisible =
    false;


/* =====================================================
   شروع
===================================================== */


async function start() {


    try {


        /* -----------------------------------------
           مرز
        ----------------------------------------- */


        const geoResponse =
            await fetch(

                "bestar_talab_maharlo.geojson?"
                +
                Date.now()

            );


        if (
            !geoResponse.ok
        ) {

            throw new Error(
                "مرز تالاب پیدا نشد."
            );

        }


        const geojson =
            await geoResponse.json();


        wetlandLayer =
            L.geoJSON(

                geojson,

                {

                    style: {

                        color:
                            "#0066ff",

                        weight:
                            3,

                        fillOpacity:
                            0

                    }

                }

            ).addTo(
                map
            );


        const bounds =
            wetlandLayer
            .getBounds();


        if (
            bounds.isValid()
        ) {

            map.fitBounds(

                bounds,

                {

                    padding:
                        [
                            20,
                            20
                        ]

                }

            );

        }


        /* -----------------------------------------
           آرشیو
        ----------------------------------------- */


        const archiveResponse =
            await fetch(

                "data/archive.json?"
                +
                Date.now()

            );


        if (
            !archiveResponse.ok
        ) {

            throw new Error(
                "آرشیو تصاویر پیدا نشد."
            );

        }


        archive =
            await archiveResponse.json();


        if (
            !archive.items
            ||
            !archive.items.length
        ) {

            throw new Error(
                "در ۳۰ روز گذشته تصویر مناسبی پیدا نشد."
            );

        }


        /* -----------------------------------------
           ساخت اسلایدر
        ----------------------------------------- */


        const slider =
            document.getElementById(
                "dateSlider"
            );


        slider.max =
            archive.items.length - 1;


        slider.value =
            0;


        slider.addEventListener(

            "input",

            function () {

                showItem(
                    Number(
                        this.value
                    )
                );

            }

        );


        createDateLabels();


        /* -----------------------------------------
           نمایش جدیدترین روز
        ----------------------------------------- */


        showItem(
            0
        );


    }

    catch (
        error
    ) {


        console.error(
            error
        );


        document.getElementById(
            "status"
        ).textContent =
            error.message;


        document.getElementById(
            "status"
        ).className =
            "status error";


    }

}


/* =====================================================
   برچسب تاریخ‌ها
===================================================== */


function createDateLabels() {


    const container =
        document.getElementById(
            "dateLabels"
        );


    container.innerHTML =
        "";


    archive.items
        .slice()
        .reverse()
        .forEach(

            item => {

                const label =
                    document.createElement(
                        "span"
                    );


                label.className =
                    "date-label";


                label.textContent =
                    formatDate(
                        item.date
                    );


                container
                    .appendChild(
                        label
                    );

            }

        );

}


/* =====================================================
   نمایش یک روز
===================================================== */


async function showItem(
    index
) {


    selectedItem =
        archive.items[index];


    if (
        !selectedItem
    ) {

        return;

    }


    /* -----------------------------------------
       اطلاعات
    ----------------------------------------- */


    document.getElementById(
        "selectedDate"
    ).textContent =
        formatDate(
            selectedItem.date
        );


    document.getElementById(
        "waterArea"
    ).textContent =
        Number(
            selectedItem.water_area_ha
        ).toLocaleString(
            "fa-IR",
            {
                maximumFractionDigits:
                    2
            }
        );


    document.getElementById(
        "cloud"
    ).textContent =
        Number(
            selectedItem.cloud_cover
        ).toFixed(
            1
        )
        +
        "%";


    document.getElementById(
        "status"
    ).textContent =
        "در حال نمایش تصویر...";


    /* -----------------------------------------
       حذف لایه‌های قبلی
    ----------------------------------------- */


    if (
        rgbLayer
    ) {

        map.removeLayer(
            rgbLayer
        );

        rgbLayer =
            null;

    }


    if (
        waterLayer
    ) {

        map.removeLayer(
            waterLayer
        );

        waterLayer =
            null;

    }


    waterVisible =
        false;


    const button =
        document.getElementById(
            "waterButton"
        );


    button.textContent =
        "نمایش محدوده آب";


    button.classList.remove(
        "active"
    );


    /* -----------------------------------------
       تصویر
    ----------------------------------------- */


    const bbox =
        await getWetlandBBox();


    const imageBounds = [

        [
            bbox[1],
            bbox[0]
        ],

        [
            bbox[3],
            bbox[2]
        ]

    ];


    const rgbImage =
        await loadImage(

            selectedItem.image
            +
            "?"
            +
            Date.now()

        );


    const clippedRGB =
        clipImage(

            rgbImage,

            window.wetlandGeoJSON,

            bbox

        );


    rgbLayer =
        L.imageOverlay(

            clippedRGB,

            imageBounds,

            {
                opacity:
                    0.85
            }

        ).addTo(
            map
        );


    /* -----------------------------------------
       آب
    ----------------------------------------- */


    const waterImage =
        await loadImage(

            selectedItem.water_image
            +
            "?"
            +
            Date.now()

        );


    const clippedWater =
        clipImage(

            waterImage,

            window.wetlandGeoJSON,

            bbox

        );


    waterLayer =
        L.imageOverlay(

            clippedWater,

            imageBounds,

            {
                opacity:
                    0.9
            }

        );


    wetlandLayer.bringToFront();


    document.getElementById(
        "status"
    ).textContent =
        "تصویر آماده است.";

}


/* =====================================================
   روشن / خاموش کردن آب
===================================================== */


function toggleWater() {


    if (
        !waterLayer
    ) {

        return;

    }


    const button =
        document.getElementById(
            "waterButton"
        );


    if (
        !waterVisible
    ) {


        if (
            rgbLayer
        ) {

            map.removeLayer(
                rgbLayer
            );

        }


        waterLayer.addTo(
            map
        );


        waterVisible =
            true;


        button.textContent =
            "نمایش تصویر ماهواره‌ای";


        button.classList.add(
            "active"
        );


        document.getElementById(
            "status"
        ).textContent =
            "محدوده آب شناسایی‌شده نمایش داده می‌شود.";


    } else {


        map.removeLayer(
            waterLayer
        );


        rgbLayer.addTo(
            map
        );


        waterVisible =
            false;


        button.textContent =
            "نمایش محدوده آب";


        button.classList.remove(
            "active"
        );


        document.getElementById(
            "status"
        ).textContent =
            "تصویر ماهواره‌ای نمایش داده می‌شود.";

    }


    wetlandLayer.bringToFront();

}


/* =====================================================
   دریافت BBOX
===================================================== */


async function getWetlandBBox() {


    if (
        window.wetlandBBox
    ) {

        return window.wetlandBBox;

    }


    const response =
        await fetch(

            "bestar_talab_maharlo.geojson?"
            +
            Date.now()

        );


    const geojson =
        await response.json();


    window.wetlandGeoJSON =
        geojson;


    const points =
        [];


    function collect(
        obj
    ) {

        if (

            Array.isArray(obj)

            &&

            obj.length >= 2

            &&

            typeof obj[0] ===
                "number"

            &&

            typeof obj[1] ===
                "number"

        ) {

            points.push(
                [
                    obj[0],
                    obj[1]
                ]
            );

            return;

        }


        if (
            Array.isArray(obj)
        ) {

            obj.forEach(
                collect
            );

        }

    }


    collect(
        geojson
        .features[0]
        .geometry
        .coordinates
    );


    const minLon =
        Math.min(
            ...points.map(
                p => p[0]
            )
        );


    const maxLon =
        Math.max(
            ...points.map(
                p => p[0]
            )
        );


    const minLat =
        Math.min(
            ...points.map(
                p => p[1]
            )
        );


    const maxLat =
        Math.max(
            ...points.map(
                p => p[1]
            )
        );


    window.wetlandBBox = [

        minLon,
        minLat,
        maxLon,
        maxLat

    ];


    return window.wetlandBBox;

}


/* =====================================================
   بارگذاری تصویر
===================================================== */


function loadImage(
    url
) {


    return new Promise(

        (
            resolve,
            reject
        ) => {


            const image =
                new Image();


            image.onload =
                () =>
                    resolve(
                        image
                    );


            image.onerror =
                () =>
                    reject(
                        new Error(
                            "تصویر این تاریخ پیدا نشد."
                        )
                    );


            image.src =
                url;

        }

    );

}


/* =====================================================
   برش تصویر
===================================================== */


function clipImage(
    image,
    geojson,
    bbox
) {


    const canvas =
        document.createElement(
            "canvas"
        );


    const width =
        image.naturalWidth;


    const height =
        image.naturalHeight;


    canvas.width =
        width;


    canvas.height =
        height;


    const ctx =
        canvas.getContext(
            "2d"
        );


    ctx.drawImage(

        image,

        0,
        0,

        width,
        height

    );


    const minLon =
        bbox[0];


    const minLat =
        bbox[1];


    const maxLon =
        bbox[2];


    const maxLat =
        bbox[3];


    function x(
        lon
    ) {

        return (

            (
                lon -
                minLon
            )

            /

            (
                maxLon -
                minLon
            )

        )
        *
        width;

    }


    function y(
        lat
    ) {

        return (

            (
                maxLat -
                lat
            )

            /

            (
                maxLat -
                minLat
            )

        )
        *
        height;

    }


    const mask =
        document.createElement(
            "canvas"
        );


    mask.width =
        width;


    mask.height =
        height;


    const mctx =
        mask.getContext(
            "2d"
        );


    mctx.fillStyle =
        "#ffffff";


    const geometry =
        geojson
        .features[0]
        .geometry;


    function drawPolygon(
        coords
    ) {


        mctx.beginPath();


        for (
            const ring
            of coords
        ) {


            if (
                !ring
                ||
                ring.length <
                    3
            ) {

                continue;

            }


            const first =
                ring[0];


            mctx.moveTo(

                x(
                    first[0]
                ),

                y(
                    first[1]
                )

            );


            for (
                let i = 1;

                i < ring.length;

                i++
            ) {


                mctx.lineTo(

                    x(
                        ring[i][0]
                    ),

                    y(
                        ring[i][1]
                    )

                );

            }


            mctx.closePath();

        }


        mctx.fill(
            "evenodd"
        );

    }


    if (
        geometry.type ===
        "Polygon"
    ) {


        drawPolygon(
            geometry.coordinates
        );


    }

    else if (
        geometry.type ===
        "MultiPolygon"
    ) {


        for (
            const polygon
            of geometry.coordinates
        ) {


            drawPolygon(
                polygon
            );

        }

    }


    ctx.globalCompositeOperation =
        "destination-in";


    ctx.drawImage(
        mask,
        0,
        0
    );


    ctx.globalCompositeOperation =
        "source-over";


    return canvas.toDataURL(
        "image/png"
    );

}


/* =====================================================
   تاریخ شمسی ساده
===================================================== */


function formatDate(
    dateString
) {


    const date =
        new Date(
            dateString
            +
            "T00:00:00"
        );


    return date.toLocaleDateString(

        "fa-IR",

        {

            year:
                "numeric",

            month:
                "long",

            day:
                "numeric"

        }

    );

}


/* =====================================================
   ذخیره GeoJSON در حافظه
===================================================== */


(async function () {


    try {

        const response =
            await fetch(
                "bestar_talab_maharlo.geojson?"
                +
                Date.now()
            );


        window.wetlandGeoJSON =
            await response.json();


    } catch (e) {

        console.error(e);

    }


    start();

})();

</script>

</body>

</html>
