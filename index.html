<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>سامانه پایش تالاب مهارلو</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>
        body {
            margin: 0;
            font-family: Tahoma, Arial, sans-serif;
        }

        header {
            height: 60px;
            background: #f28c28;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
        }

        #map {
            width: 100%;
            height: calc(100vh - 60px);
        }

        .panel {
            position: absolute;
            top: 75px;
            right: 15px;
            z-index: 1000;
            width: 320px;
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0,0,0,.2);
        }

        .title {
            font-weight: bold;
            margin-bottom: 10px;
        }

        .status {
            color: green;
            font-size: 13px;
            line-height: 1.8;
        }

        .error {
            color: red;
        }
    </style>
</head>

<body>

<header>
    سامانه پایش تالاب مهارلو
</header>

<div id="map"></div>

<div class="panel">
    <div class="title">
        تصویر Sentinel-2
    </div>

    <div id="status" class="status">
        در حال بارگذاری...
    </div>

    <div id="info" style="display:none; margin-top:8px;">
        <div>نوع: <b id="type"></b></div>
        <div>ابر مجاز: <b id="cloud"></b></div>
        <div>بازه جست‌وجو: <b id="days"></b> روز</div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map = L.map("map").setView(
    [29.43, 52.82],
    10
);

L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        attribution: "&copy; OpenStreetMap contributors"
    }
).addTo(map);


/* --------------------------------
   مرز تالاب
-------------------------------- */

fetch(
    "bestar_talab_maharlo.geojson?" +
    Date.now()
)

.then(response => {

    if (!response.ok) {
        throw new Error(
            "مرز تالاب پیدا نشد."
        );
    }

    return response.json();

})

.then(geojson => {

    const wetland =
        L.geoJSON(
            geojson,
            {
                style: {
                    color: "#0066ff",
                    weight: 3,
                    fillColor: "#00aaff",
                    fillOpacity: 0.15
                }
            }
        ).addTo(map);

    const bounds =
        wetland.getBounds();

    if (bounds.isValid()) {

        map.fitBounds(
            bounds,
            {
                padding: [20, 20]
            }
        );

    }

    loadSentinel();

})

.catch(error => {

    document.getElementById(
        "status"
    ).textContent =
        error.message;

    document.getElementById(
        "status"
    ).className =
        "status error";

});


/* --------------------------------
   تصویر Sentinel-2
-------------------------------- */

function loadSentinel() {

    /*
       محدوده واقعی تالاب
       از wetland-data.json
    */

    fetch(
        "data/wetland-data.json?" +
        Date.now()
    )

    .then(response => {

        if (!response.ok) {
            throw new Error(
                "فایل اطلاعات Sentinel-2 پیدا نشد."
            );
        }

        return response.json();

    })

    .then(data => {

        console.log(
            "Sentinel data:",
            data
        );


        if (
            !data.image ||
            !data.image.bbox
        ) {

            throw new Error(
                "اطلاعات محدوده تصویر پیدا نشد."
            );

        }


        /*
           BBOX:

           [minLon, minLat,
            maxLon, maxLat]
        */

        const bbox =
            data.image.bbox;


        const imageBounds = [

            [
                bbox[1],
                bbox[0]
            ],

            [
                bbox[3],
                bbox[2]
            ]

        ];


        /*
           فایل واقعی تصویر
        */

        const imageURL =
            "data/maharlo_sentinel2.png?" +
            Date.now();


        /*
           اضافه کردن تصویر
        */

        const sentinelLayer =
            L.imageOverlay(
                imageURL,
                imageBounds,
                {
                    opacity: 0.75,
                    interactive: true
                }
            );


        sentinelLayer.addTo(map);


        /*
           اطلاعات
        */

        document.getElementById(
            "type"
        ).textContent =
            data.image.type ||
            "Sentinel-2 L2A";


        document.getElementById(
            "cloud"
        ).textContent =
            data.image.max_cloud +
            "%";


        document.getElementById(
            "days"
        ).textContent =
            data.image.period_days;


        document.getElementById(
            "info"
        ).style.display =
            "block";


        document.getElementById(
            "status"
        ).textContent =
            "تصویر Sentinel-2 با موفقیت روی نقشه نمایش داده شد.";

    })

    .catch(error => {

        console.error(error);

        document.getElementById(
            "status"
        ).textContent =
            error.message;

        document.getElementById(
            "status"
        ).className =
            "status error";

    });

}

</script>

</body>
</html>
