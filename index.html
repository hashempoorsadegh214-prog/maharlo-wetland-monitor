<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>سامانه پایش تالاب مهارلو</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Tahoma, Arial, sans-serif;
        }

        header {
            height: 60px;
            background: #f28c28;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
        }

        #map {
            width: 100%;
            height: calc(100vh - 60px);
        }

        .panel {
            position: absolute;
            top: 75px;
            right: 15px;
            z-index: 1000;
            width: 320px;
            background: white;
            padding: 14px;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0,0,0,.2);
            line-height: 1.8;
        }

        .title {
            font-weight: bold;
            margin-bottom: 8px;
        }

        .status {
            font-size: 13px;
        }

        .ok {
            color: green;
        }

        .error {
            color: red;
        }
    </style>
</head>

<body>

<header>
    سامانه پایش تالاب مهارلو
</header>

<div id="map"></div>

<div class="panel">

    <div class="title">
        آخرین تصویر Sentinel-2
    </div>

    <div id="status" class="status">
        در حال بارگذاری...
    </div>

    <div id="details" style="display:none;">

        <div>
            تاریخ:
            <b id="date"></b>
        </div>

        <div>
            درصد ابر:
            <b id="cloud"></b>
        </div>

        <div>
            نوع تصویر:
            <b id="type"></b>
        </div>

    </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map = L.map("map").setView(
    [29.43, 52.82],
    10
);

L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        attribution:
            "&copy; OpenStreetMap"
    }
).addTo(map);


/* --------------------------------
   بارگذاری مرز تالاب
-------------------------------- */

async function loadSite() {

    try {

        const geoResponse =
            await fetch(
                "bestar_talab_maharlo.geojson?" +
                Date.now()
            );

        if (!geoResponse.ok) {
            throw new Error(
                "مرز تالاب پیدا نشد."
            );
        }

        const geojson =
            await geoResponse.json();


        const wetland =
            L.geoJSON(
                geojson,
                {
                    style: {
                        color: "#0066ff",
                        weight: 3,
                        fillColor: "#00aaff",
                        fillOpacity: 0.18
                    }
                }
            ).addTo(map);


        const wetlandBounds =
            wetland.getBounds();


        if (wetlandBounds.isValid()) {

            map.fitBounds(
                wetlandBounds,
                {
                    padding: [20, 20]
                }
            );

        }


        /* --------------------------------
           دریافت اطلاعات تصویر
        -------------------------------- */

        const dataResponse =
            await fetch(
                "data/wetland-data.json?" +
                Date.now()
            );

        if (!dataResponse.ok) {

            throw new Error(
                "فایل اطلاعات تصویر پیدا نشد."
            );

        }


        const data =
            await dataResponse.json();


        /*
           ساختار جدید فایل JSON:
           
           data.image.file
           data.image.bbox
           data.image.type
        */


        if (
            !data.image ||
            !data.image.file
        ) {

            throw new Error(
                "اطلاعات تصویر Sentinel-2 پیدا نشد."
            );

        }


        /* --------------------------------
           نمایش اطلاعات
        -------------------------------- */

        document.getElementById(
            "type"
        ).textContent =
            data.image.type || "Sentinel-2";


        document.getElementById(
            "details"
        ).style.display =
            "block";


        /* --------------------------------
           نمایش تصویر
        -------------------------------- */

        const imageUrl =
            data.image.file +
            "?" +
            Date.now();


        const bbox =
            data.image.bbox;


        if (
            !bbox ||
            bbox.length !== 4
        ) {

            throw new Error(
                "محدوده تصویر مشخص نیست."
            );

        }


        /*
           BBOX:
           [minLon, minLat, maxLon, maxLat]
        */

        const imageBounds = [

            [
                bbox[1],
                bbox[0]
            ],

            [
                bbox[3],
                bbox[2]
            ]

        ];


        /*
           اضافه کردن تصویر
           روی نقشه
        */

        const image =
            L.imageOverlay(
                imageUrl,
                imageBounds,
                {
                    opacity: 0.75,
                    interactive: true
                }
            );


        image.addTo(map);


        /*
           زوم روی تالاب
        */

        map.fitBounds(
            wetlandBounds,
            {
                padding: [20, 20]
            }
        );


        document.getElementById(
            "status"
        ).textContent =
            "تصویر Sentinel-2 نمایش داده شد.";

        document.getElementById(
            "status"
        ).className =
            "status ok";


    }

    catch (error) {

        console.error(error);

        document.getElementById(
            "status"
        ).textContent =
            error.message;

        document.getElementById(
            "status"
        ).className =
            "status error";

    }

}


loadSite();

</script>

</body>
</html>
