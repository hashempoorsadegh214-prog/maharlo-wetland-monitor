<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>سامانه پایش تالاب مهارلو</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Tahoma, Arial, sans-serif;
            background: #f4f6f8;
        }

        header {
            height: 60px;
            background: #f28c28;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
        }

        #map {
            width: 100%;
            height: calc(100vh - 60px);
        }

        .panel {
            position: absolute;
            top: 75px;
            right: 15px;
            z-index: 1000;
            width: 320px;
            max-width: calc(100% - 30px);
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.2);
            line-height: 1.8;
        }

        .title {
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 17px;
        }

        .status {
            color: #067647;
            font-size: 13px;
        }

        .error {
            color: #b42318;
        }

        .button {
            width: 100%;
            border: none;
            border-radius: 8px;
            padding: 10px;
            margin-top: 12px;
            background: #0066ff;
            color: white;
            font-family: inherit;
            cursor: pointer;
        }

        .button.active {
            background: #0050c8;
        }

        .info {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #ddd;
            font-size: 13px;
        }
    </style>
</head>

<body>

<header>
    سامانه پایش تالاب مهارلو
</header>

<div id="map"></div>

<div class="panel">

    <div class="title">
        پایش تالاب مهارلو
    </div>

    <div id="status" class="status">
        در حال بارگذاری...
    </div>

    <button
        id="ndwiButton"
        class="button"
        onclick="toggleNDWI()"
    >
        نمایش NDWI
    </button>

    <div id="info" class="info" style="display:none;">

        <div>
            نوع تصویر:
            <b id="type">---</b>
        </div>

        <div>
            حداکثر ابر:
            <b id="cloud">---</b>
        </div>

    </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map =
    L.map("map").setView(
        [29.43, 52.82],
        10
    );

L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        attribution:
            "&copy; OpenStreetMap contributors"
    }
).addTo(map);


let wetlandLayer = null;
let rgbLayer = null;
let ndwiLayer = null;
let ndwiVisible = false;


/* =========================================================
   بارگذاری سایت
========================================================= */

async function loadSite() {

    try {

        /* --------------------------------
           مرز تالاب
        -------------------------------- */

        const geoResponse =
            await fetch(
                "bestar_talab_maharlo.geojson?" +
                Date.now()
            );

        if (!geoResponse.ok) {

            throw new Error(
                "فایل مرز تالاب پیدا نشد."
            );

        }

        const geojson =
            await geoResponse.json();


        wetlandLayer =
            L.geoJSON(
                geojson,
                {
                    style: {
                        color: "#0066ff",
                        weight: 3,
                        fillColor: "#00aaff",
                        fillOpacity: 0.10
                    }
                }
            ).addTo(map);


        const wetlandBounds =
            wetlandLayer.getBounds();


        if (wetlandBounds.isValid()) {

            map.fitBounds(
                wetlandBounds,
                {
                    padding: [20, 20]
                }
            );

        }


        /* --------------------------------
           اطلاعات
        -------------------------------- */

        const dataResponse =
            await fetch(
                "data/wetland-data.json?" +
                Date.now()
            );


        if (!dataResponse.ok) {

            throw new Error(
                "فایل اطلاعات پیدا نشد."
            );

        }


        const data =
            await dataResponse.json();


        document.getElementById(
            "type"
        ).textContent =
            data.image?.type ||
            "Sentinel-2 L2A";


        document.getElementById(
            "cloud"
        ).textContent =
            data.image?.max_cloud != null
                ? data.image.max_cloud + "%"
                : "---";


        document.getElementById(
            "info"
        ).style.display =
            "block";


        /* --------------------------------
           محدوده تصویر
        -------------------------------- */

        const bbox =
            data.image.bbox;


        const imageBounds = [

            [
                bbox[1],
                bbox[0]
            ],

            [
                bbox[3],
                bbox[2]
            ]

        ];


        /* --------------------------------
           تصویر اصلی
        -------------------------------- */

        const rgbURL =
            data.image.file +
            "?" +
            Date.now();


        const rgbImage =
            await loadImage(
                rgbURL
            );


        const clippedRGB =
            createClippedImage(
                rgbImage,
                geojson,
                bbox
            );


        rgbLayer =
            L.imageOverlay(
                clippedRGB,
                imageBounds,
                {
                    opacity: 0.85
                }
            ).addTo(map);


        /* --------------------------------
           لایه NDWI
        -------------------------------- */

        if (
            data.ndwi &&
            data.ndwi.file
        ) {

            const ndwiURL =
                data.ndwi.file +
                "?" +
                Date.now();


            ndwiLayer =
                L.imageOverlay(
                    ndwiURL,
                    imageBounds,
                    {
                        opacity: 0.85
                    }
                );


        }


        wetlandLayer.bringToFront();


        document.getElementById(
            "status"
        ).textContent =
            "تصویر Sentinel-2 آماده است.";


    }

    catch (error) {

        console.error(error);

        document.getElementById(
            "status"
        ).textContent =
            error.message;

        document.getElementById(
            "status"
        ).className =
            "status error";

    }

}


/* =========================================================
   نمایش / مخفی کردن NDWI
========================================================= */

function toggleNDWI() {

    if (!ndwiLayer) {

        alert(
            "لایه NDWI هنوز آماده نشده است."
        );

        return;

    }


    const button =
        document.getElementById(
            "ndwiButton"
        );


    if (!ndwiVisible) {

        ndwiLayer.addTo(map);

        ndwiVisible = true;

        button.textContent =
            "مخفی کردن NDWI";

        button.classList.add(
            "active"
        );

    }

    else {

        map.removeLayer(
            ndwiLayer
        );

        ndwiVisible = false;

        button.textContent =
            "نمایش NDWI";

        button.classList.remove(
            "active"
        );

    }


    wetlandLayer.bringToFront();
}


/* =========================================================
   بارگذاری تصویر
========================================================= */

function loadImage(url) {

    return new Promise(
        (resolve, reject) => {

            const image =
                new Image();

            image.onload =
                function() {

                    resolve(
                        image
                    );

                };

            image.onerror =
                function() {

                    reject(
                        new Error(
                            "تصویر قابل بارگذاری نیست."
                        )
                    );

                };

            image.src =
                url;

        }
    );

}


/* =========================================================
   برش تصویر اصلی داخل تالاب
========================================================= */

function createClippedImage(
    image,
    geojson,
    bbox
) {

    const canvas =
        document.createElement(
            "canvas"
        );


    const width =
        image.naturalWidth ||
        image.width;


    const height =
        image.naturalHeight ||
        image.height;


    canvas.width =
        width;

    canvas.height =
        height;


    const ctx =
        canvas.getContext(
            "2d"
        );


    ctx.drawImage(
        image,
        0,
        0,
        width,
        height
    );


    const minLon =
        bbox[0];

    const minLat =
        bbox[1];

    const maxLon =
        bbox[2];

    const maxLat =
        bbox[3];


    function lonToX(
        lon
    ) {

        return (
            (lon - minLon) /
            (maxLon - minLon)
        ) * width;

    }


    function latToY(
        lat
    ) {

        return (
            (maxLat - lat) /
            (maxLat - minLat)
        ) * height;

    }


    const maskCanvas =
        document.createElement(
            "canvas"
        );


    maskCanvas.width =
        width;

    maskCanvas.height =
        height;


    const maskCtx =
        maskCanvas.getContext(
            "2d"
        );


    function drawPolygon(
        coordinates
    ) {

        maskCtx.beginPath();


        for (
            const ring
            of coordinates
        ) {

            if (
                !ring ||
                ring.length < 3
            ) {

                continue;

            }


            const first =
                ring[0];


            maskCtx.moveTo(
                lonToX(
                    first[0]
                ),
                latToY(
                    first[1]
                )
            );


            for (
                let i = 1;
                i < ring.length;
                i++
            ) {

                const point =
                    ring[i];


                maskCtx.lineTo(
                    lonToX(
                        point[0]
                    ),
                    latToY(
                        point[1]
                    )
                );

            }


            maskCtx.closePath();

        }


        maskCtx.fill(
            "evenodd"
        );

    }


    const feature =
        geojson.features[0];


    const geometry =
        feature.geometry;


    maskCtx.fillStyle =
        "#ffffff";


    if (
        geometry.type ===
        "Polygon"
    ) {

        drawPolygon(
            geometry.coordinates
        );

    }

    else if (
        geometry.type ===
        "MultiPolygon"
    ) {

        for (
            const polygon
            of geometry.coordinates
        ) {

            drawPolygon(
                polygon
            );

        }

    }


    ctx.globalCompositeOperation =
        "destination-in";


    ctx.drawImage(
        maskCanvas,
        0,
        0
    );


    ctx.globalCompositeOperation =
        "source-over";


    return canvas.toDataURL(
        "image/png"
    );

}


/* =========================================================
   شروع
========================================================= */

loadSite();

</script>

</body>
</html>
