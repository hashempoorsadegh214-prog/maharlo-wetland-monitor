<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>سامانه پایش تالاب مهارلو</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>
        body {
            margin: 0;
            font-family: Tahoma, Arial, sans-serif;
        }

        header {
            height: 60px;
            background: #f28c28;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 20px;
        }

        #map {
            height: calc(100vh - 60px);
            width: 100%;
        }

        .panel {
            position: absolute;
            top: 75px;
            right: 15px;
            z-index: 1000;
            width: 320px;
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0,0,0,.2);
        }

        .button {
            width: 100%;
            margin-top: 10px;
            padding: 10px;
            border: none;
            border-radius: 8px;
            background: #0066ff;
            color: white;
            font-family: inherit;
            cursor: pointer;
        }

        .button.active {
            background: #0050b8;
        }

        #status {
            margin-top: 8px;
            font-size: 13px;
        }
    </style>
</head>

<body>

<header>
    سامانه پایش تالاب مهارلو
</header>

<div id="map"></div>

<div class="panel">

    <b>پایش تالاب مهارلو</b>

    <div id="status">
        در حال بارگذاری...
    </div>

    <button
        class="button"
        id="waterButton"
        onclick="toggleWater()"
    >
        نمایش آب
    </button>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map =
    L.map("map").setView(
        [29.43, 52.82],
        10
    );

L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        attribution:
            "&copy; OpenStreetMap contributors"
    }
).addTo(map);


let wetlandLayer = null;
let rgbLayer = null;
let waterLayer = null;
let waterVisible = false;


/* ======================================
   شروع
====================================== */

async function start() {

    try {

        const geoResponse =
            await fetch(
                "bestar_talab_maharlo.geojson?" +
                Date.now()
            );

        if (!geoResponse.ok) {

            throw new Error(
                "مرز تالاب پیدا نشد."
            );

        }


        const geojson =
            await geoResponse.json();


        wetlandLayer =
            L.geoJSON(
                geojson,
                {
                    style: {
                        color: "#0066ff",
                        weight: 3,
                        fillOpacity: 0
                    }
                }
            ).addTo(map);


        map.fitBounds(
            wetlandLayer.getBounds()
        );


        const dataResponse =
            await fetch(
                "data/wetland-data.json?" +
                Date.now()
            );


        const data =
            await dataResponse.json();


        const bbox =
            data.image.bbox;


        const bounds = [

            [
                bbox[1],
                bbox[0]
            ],

            [
                bbox[3],
                bbox[2]
            ]

        ];


        /* ======================================
           تصویر اصلی
        ====================================== */

        const rgb =
            await loadImage(
                "data/maharlo_sentinel2.png?" +
                Date.now()
            );


        const clippedRGB =
            clipImage(
                rgb,
                geojson,
                bbox
            );


        rgbLayer =
            L.imageOverlay(
                clippedRGB,
                bounds,
                {
                    opacity: .85
                }
            ).addTo(map);


        /* ======================================
           لایه آب
        ====================================== */

        const water =
            await loadImage(
                "data/maharlo_water.png?" +
                Date.now()
            );


        const clippedWater =
            clipImage(
                water,
                geojson,
                bbox
            );


        waterLayer =
            L.imageOverlay(
                clippedWater,
                bounds,
                {
                    opacity: 1
                }
            );


        document.getElementById(
            "status"
        ).textContent =
            "تصویر آماده است.";


        wetlandLayer.bringToFront();

    }

    catch (e) {

        console.error(e);

        document.getElementById(
            "status"
        ).textContent =
            e.message;

    }

}


/* ======================================
   نمایش آب
====================================== */

function toggleWater() {

    if (!waterLayer) {

        alert(
            "لایه آب آماده نیست."
        );

        return;
    }


    const button =
        document.getElementById(
            "waterButton"
        );


    if (!waterVisible) {

        map.removeLayer(
            rgbLayer
        );

        waterLayer.addTo(
            map
        );

        waterVisible = true;

        button.textContent =
            "نمایش تصویر اصلی";

        button.classList.add(
            "active"
        );


        document.getElementById(
            "status"
        ).textContent =
            "آب شناسایی‌شده نمایش داده می‌شود.";

    }

    else {

        map.removeLayer(
            waterLayer
        );

        rgbLayer.addTo(
            map
        );

        waterVisible = false;

        button.textContent =
            "نمایش آب";

        button.classList.remove(
            "active"
        );


        document.getElementById(
            "status"
        ).textContent =
            "تصویر اصلی نمایش داده می‌شود.";

    }


    wetlandLayer.bringToFront();
}


/* ======================================
   خواندن تصویر
====================================== */

function loadImage(url) {

    return new Promise(
        (resolve, reject) => {

            const image =
                new Image();

            image.onload =
                () => resolve(image);

            image.onerror =
                () => reject(
                    new Error(
                        "فایل تصویر پیدا نشد."
                    )
                );

            image.src =
                url;

        }
    );
}


/* ======================================
   بریدن تصویر با مرز تالاب
====================================== */

function clipImage(
    image,
    geojson,
    bbox
) {

    const canvas =
        document.createElement(
            "canvas"
        );

    const width =
        image.naturalWidth;

    const height =
        image.naturalHeight;


    canvas.width =
        width;

    canvas.height =
        height;


    const ctx =
        canvas.getContext(
            "2d"
        );


    ctx.drawImage(
        image,
        0,
        0,
        width,
        height
    );


    const minLon =
        bbox[0];

    const minLat =
        bbox[1];

    const maxLon =
        bbox[2];

    const maxLat =
        bbox[3];


    function x(lon) {

        return (
            (lon - minLon) /
            (maxLon - minLon)
        ) * width;

    }


    function y(lat) {

        return (
            (maxLat - lat) /
            (maxLat - minLat)
        ) * height;

    }


    const mask =
        document.createElement(
            "canvas"
        );

    mask.width =
        width;

    mask.height =
        height;


    const mctx =
        mask.getContext(
            "2d"
        );


    mctx.fillStyle =
        "white";


    const geometry =
        geojson.features[0].geometry;


    function drawPolygon(
        coords
    ) {

        mctx.beginPath();


        for (
            const ring
            of coords
        ) {

            const p =
                ring[0];

            mctx.moveTo(
                x(p[0]),
                y(p[1])
            );


            for (
                let i = 1;
                i < ring.length;
                i++
            ) {

                mctx.lineTo(
                    x(ring[i][0]),
                    y(ring[i][1])
                );

            }

            mctx.closePath();

        }


        mctx.fill("evenodd");

    }


    if (
        geometry.type ===
        "Polygon"
    ) {

        drawPolygon(
            geometry.coordinates
        );

    }

    else if (
        geometry.type ===
        "MultiPolygon"
    ) {

        for (
            const polygon
            of geometry.coordinates
        ) {

            drawPolygon(
                polygon
            );

        }

    }


    ctx.globalCompositeOperation =
        "destination-in";


    ctx.drawImage(
        mask,
        0,
        0
    );


    ctx.globalCompositeOperation =
        "source-over";


    return canvas.toDataURL(
        "image/png"
    );

}


start();

</script>

</body>
</html>
