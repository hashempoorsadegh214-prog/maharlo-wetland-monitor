<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>سامانه پایش تالاب مهارلو</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Tahoma, Arial, sans-serif;
        }

        header {
            height: 60px;
            background: #f28c28;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
        }

        #map {
            width: 100%;
            height: calc(100vh - 60px);
        }

        .panel {
            position: absolute;
            top: 75px;
            right: 15px;
            z-index: 1000;
            width: 320px;
            background: white;
            padding: 14px;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0,0,0,.2);
            line-height: 1.8;
        }

        .title {
            font-weight: bold;
            margin-bottom: 8px;
        }

        .status {
            font-size: 13px;
        }

        .ok {
            color: green;
        }

        .error {
            color: red;
        }
    </style>
</head>

<body>

<header>
    سامانه پایش تالاب مهارلو
</header>

<div id="map"></div>

<div class="panel">
    <div class="title">آخرین تصویر Sentinel-2</div>

    <div id="status" class="status">
        در حال بارگذاری...
    </div>

    <div id="details" style="display:none;">
        <div>تاریخ: <b id="date"></b></div>
        <div>ابر: <b id="cloud"></b></div>
        <div>تصویر: <b id="imageId"></b></div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map = L.map("map").setView([29.43, 52.82], 10);

L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        attribution: "&copy; OpenStreetMap"
    }
).addTo(map);


/* -----------------------------
   مرز تالاب
----------------------------- */

let wetlandLayer = null;


/* -----------------------------
   بارگذاری اطلاعات
----------------------------- */

async function loadData() {

    try {

        const geoResponse =
            await fetch(
                "bestar_talab_maharlo.geojson"
            );

        if (!geoResponse.ok) {
            throw new Error(
                "مرز تالاب پیدا نشد."
            );
        }

        const geojson =
            await geoResponse.json();


        wetlandLayer =
            L.geoJSON(
                geojson,
                {
                    style: {
                        color: "#0066ff",
                        weight: 3,
                        fillColor: "#00aaff",
                        fillOpacity: 0.18
                    }
                }
            ).addTo(map);


        const wetlandBounds =
            wetlandLayer.getBounds();

        map.fitBounds(
            wetlandBounds,
            {
                padding: [20, 20]
            }
        );


        /* -----------------------------
           اطلاعات Sentinel-2
        ----------------------------- */

        const dataResponse =
            await fetch(
                "data/wetland-data.json?"+Date.now()
            );

        if (!dataResponse.ok) {
            throw new Error(
                "فایل اطلاعات Sentinel-2 پیدا نشد."
            );
        }

        const data =
            await dataResponse.json();


        const image =
            data.sentinel2;


        if (!image) {
            throw new Error(
                "تصویر Sentinel-2 پیدا نشده است."
            );
        }


        /* -----------------------------
           نمایش اطلاعات
        ----------------------------- */

        document.getElementById(
            "date"
        ).textContent =
            image.date
            ? new Date(
                image.date
            ).toLocaleString(
                "fa-IR"
            )
            : "---";


        document.getElementById(
            "cloud"
        ).textContent =
            image.cloud_cover != null
            ? Number(
                image.cloud_cover
              ).toFixed(1) + "%"
            : "---";


        document.getElementById(
            "imageId"
        ).textContent =
            image.id || "---";


        document.getElementById(
            "details"
        ).style.display =
            "block";


        /* -----------------------------
           پیدا کردن Thumbnail
        ----------------------------- */

        let imageUrl = null;


        if (
            image.assets &&
            image.assets.thumbnail &&
            image.assets.thumbnail.href
        ) {

            imageUrl =
                image.assets.thumbnail.href;

        }


        /*
           اگر thumbnail نبود،
           TCI را امتحان می‌کنیم.
        */

        if (
            !imageUrl &&
            image.assets &&
            image.assets.TCI_10m &&
            image.assets.TCI_10m.href
        ) {

            imageUrl =
                image.assets.TCI_10m.href;

        }


        if (!imageUrl) {

            throw new Error(
                "برای این تصویر، پیش‌نمایش قابل نمایش پیدا نشد."
            );
        }


        /*
           فقط لینک‌های HTTP قابل نمایش
        */

        if (
            !imageUrl.startsWith(
                "http://"
            ) &&
            !imageUrl.startsWith(
                "https://"
            )
        ) {

            throw new Error(
                "لینک تصویر مستقیماً برای نمایش در سایت قابل استفاده نیست."
            );
        }


        /* -----------------------------
           محدوده تصویر
        ----------------------------- */

        let imageBounds = null;


        if (
            image.footprint &&
            image.footprint.coordinates
        ) {

            const imageLayer =
                L.geoJSON(
                    image.footprint,
                    {
                        style: {
                            color: "#ff0000",
                            weight: 2,
                            fillOpacity: 0
                        }
                    }
                );

            imageBounds =
                imageLayer.getBounds();


            imageLayer
                .addTo(map);


            /*
               تصویر را روی محدوده صحنه قرار می‌دهیم.
            */
        }


        /*
           اگر footprint موجود نبود،
           از bbox تالاب استفاده می‌کنیم.
        */

        if (
            !imageBounds &&
            data.wetland &&
            data.wetland.bbox
        ) {

            const b =
                data.wetland.bbox;

            imageBounds = [
                [b[1], b[0]],
                [b[3], b[2]]
            ];

        }


        /* -----------------------------
           نمایش تصویر
        ----------------------------- */

        if (imageBounds) {

            const overlay =
                L.imageOverlay(
                    imageUrl,
                    imageBounds,
                    {
                        opacity: 0.75,
                        interactive: true
                    }
                );


            overlay.addTo(map);


            /*
               تصویر در محدوده خودش باشد.
            */

            map.fitBounds(
                wetlandBounds,
                {
                    padding: [20, 20]
                }
            );

        }


        document.getElementById(
            "status"
        ).textContent =
            "تصویر Sentinel-2 روی نقشه نمایش داده شد.";

        document.getElementById(
            "status"
        ).className =
            "status ok";

    }

    catch (error) {

        console.error(error);

        document.getElementById(
            "status"
        ).textContent =
            error.message;

        document.getElementById(
            "status"
        ).className =
            "status error";

    }

}


loadData();

</script>

</body>
</html>
